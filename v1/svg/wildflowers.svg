<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Sketchy Line Filter for Hand-Drawn Doodle Feel -->
    <filter id="sketch-rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <style>
      .ink-line { stroke: #2C2825; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ink-thin { stroke: #2C2825; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ink-thick { stroke: #2C2825; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      
      /* Gentle wildflower palette */
      .fill-yellow { fill: #F4A261; }
      .fill-soft-yellow { fill: #E9C46A; }
      .fill-terracotta { fill: #E07A5F; }
      .fill-pink { fill: #F2CC8F; }
      .fill-lavender { fill: #D6A2E8; }
      .fill-blue { fill: #A8DADC; }
      .fill-stem { fill: #81B29A; stroke: #2C2825; stroke-width: 2.5; }
    </style>
  </defs>

  <!-- Filtered Group for Doodle Style -->
  <g filter="url(#sketch-rough)">

    <!-- SPARKLES & DOODLE ACCENTS -->
    <!-- Top left sparkles -->
    <path class="ink-thin" d="M 110,90 Q 110,102 98,102 Q 110,102 110,114 Q 110,102 122,102 Q 110,102 110,90 Z" fill="#2C2825" opacity="0.8" />
    <path class="ink-thin" d="M 490,130 Q 490,142 478,142 Q 490,142 490,154 Q 490,142 502,142 Q 490,142 490,130 Z" fill="#2C2825" opacity="0.8" />
    <!-- Floating dots/pollen -->
    <circle cx="150" cy="140" r="3" fill="#2C2825" />
    <circle cx="450" cy="90" r="2.5" fill="#2C2825" />
    <circle cx="200" cy="80" r="2" fill="#2C2825" />
    <circle cx="410" cy="180" r="3" fill="#2C2825" />

    <!-- 1. LEFT FLOWER (Poppy / Anemone Style) -->
    <!-- Stem & Leaves -->
    <path class="ink-line" d="M 180,480 C 170,380 200,280 185,190" />
    <path class="fill-stem" d="M 178,390 C 140,380 120,360 135,345 C 150,335 172,365 178,390 Z" />
    <path class="fill-stem" d="M 182,310 C 220,300 235,280 220,265 C 200,255 185,285 182,310 Z" />

    <!-- Petals -->
    <g transform="translate(185, 190)">
      <path d="M 0,-10 C -25,-55 -65,-30 -40,-5 C -65,15 -35,55 -5,25 C 20,55 55,25 30,-5 C 55,-30 20,-55 0,-10 Z" fill="#E07A5F" class="ink-line" />
      <path d="M -15,-20 C -35,-45 -55,-20 -30,0 C -50,20 -20,40 0,15 C 20,40 45,15 20,0 C 40,-20 15,-45 -15,-20 Z" fill="#F2CC8F" opacity="0.6" class="ink-thin" />
      <!-- Center -->
      <circle cx="0" cy="0" r="14" fill="#2C2825" />
      <circle cx="0" cy="0" r="8" fill="#E9C46A" />
      <!-- Radiating lines -->
      <line x1="0" y1="-14" x2="0" y2="-22" class="ink-thin" />
      <line x1="14" y1="0" x2="22" y2="0" class="ink-thin" />
      <line x1="0" y1="14" x2="0" y2="22" class="ink-thin" />
      <line x1="-14" y1="0" x2="-22" y2="0" class="ink-thin" />
    </g>


    <!-- 2. CENTER TALL FLOWER (Coneflower / Daisy Style) -->
    <!-- Stem & Leaves -->
    <path class="ink-line" d="M 300,500 C 310,380 290,260 300,140" />
    <path class="fill-stem" d="M 298,420 C 250,410 230,380 250,365 C 270,355 292,390 298,420 Z" />
    <path class="fill-stem" d="M 301,320 C 350,310 370,280 350,265 C 330,255 308,290 301,320 Z" />

    <!-- Petals Drop/Daisy -->
    <g transform="translate(300, 140)">
      <!-- Petal paths radiating out -->
      <path class="ink-line" fill="#E9C46A" d="M -8,-10 C -12,-45 12,-45 8,-10 Z" />
      <path class="ink-line" fill="#E9C46A" d="M 10,-8 C 45,-12 45,12 10,8 Z" />
      <path class="ink-line" fill="#E9C46A" d="M 8,10 C 12,45 -12,45 -8,10 Z" />
      <path class="ink-line" fill="#E9C46A" d="M -10,8 C -45,12 -45,-12 -10,-8 Z" />
      
      <path class="ink-line" fill="#F4A261" d="M 6,-6 C 32,-32 42,-12 6,-6 Z" />
      <path class="ink-line" fill="#F4A261" d="M 6,6 C 32,32 12,42 6,6 Z" />
      <path class="ink-line" fill="#F4A261" d="M -6,6 C -32,32 -42,12 -6,6 Z" />
      <path class="ink-line" fill="#F4A261" d="M -6,-6 C -32,-32 -12,-42 -6,-6 Z" />

      <!-- Center Dome -->
      <ellipse cx="0" cy="0" rx="18" ry="16" fill="#2C2825" />
      <path d="M -12,-4 C -6,-10 6,-10 12,-4" class="ink-thin" stroke="#FCF9F2" />
      <circle cx="-4" cy="-2" r="2" fill="#FCF9F2" />
      <circle cx="4" cy="-2" r="2" fill="#FCF9F2" />
    </g>

    <!-- 3. RIGHT FLOWER (Lavender / Salvia Spike) -->
    <!-- Stem -->
    <path class="ink-line" d="M 420,490 C 410,400 425,290 415,160" />
    <path class="fill-stem" d="M 418,370 C 450,360 460,340 445,330 C 430,320 420,345 418,370 Z" />

    <!-- Lavender Pods along the top stem -->
    <g transform="translate(415, 160)">
      <!-- Pods stacked up -->
      <ellipse cx="-12" cy="70" rx="10" ry="6" fill="#D6A2E8" class="ink-line" />
      <ellipse cx="12" cy="65" rx="10" ry="6" fill="#D6A2E8" class="ink-line" />

      <ellipse cx="-14" cy="45" rx="11" ry="7" fill="#A8DADC" class="ink-line" />
      <ellipse cx="14" cy="40" rx="11" ry="7" fill="#A8DADC" class="ink-line" />

      <ellipse cx="-12" cy="20" rx="10" ry="6" fill="#D6A2E8" class="ink-line" />
      <ellipse cx="12" cy="15" rx="10" ry="6" fill="#D6A2E8" class="ink-line" />

      <ellipse cx="-10" cy="-5" rx="9" ry="6" fill="#A8DADC" class="ink-line" />
      <ellipse cx="10" cy="-10" rx="9" ry="6" fill="#A8DADC" class="ink-line" />

      <ellipse cx="0" cy="-28" rx="8" ry="10" fill="#D6A2E8" class="ink-line" />
    </g>

    <!-- 4. SMALL ACCENT BOTANICALS (Fern & Lavender Sprigs) -->
    <!-- Small Fern on Left -->
    <path class="ink-thin" d="M 120,470 C 110,410 90,360 70,320" />
    <path class="ink-thin" d="M 112,440 Q 90,430 85,440" />
    <path class="ink-thin" d="M 103,410 Q 80,400 75,410" />
    <path class="ink-thin" d="M 94,380 Q 70,370 65,380" />
    <path class="ink-thin" d="M 83,350 Q 60,340 55,350" />

    <!-- Small Flower Sprig Right -->
    <path class="ink-thin" d="M 480,480 C 490,430 510,380 520,330" />
    <circle cx="520" cy="330" r="6" fill="#F2CC8F" class="ink-thin" />
    <circle cx="510" cy="350" r="5" fill="#E07A5F" class="ink-thin" />
    <circle cx="500" cy="375" r="5" fill="#F2CC8F" class="ink-thin" />
    <circle cx="490" cy="400" r="4" fill="#E07A5F" class="ink-thin" />

    <!-- TIE RIBBON / BOW AT BOTTOM -->
    <g transform="translate(300, 470)">
      <path class="fill-terracotta ink-line" d="M 0,-5 C -25,-25 -45,-5 -20,10 C -10,15 0,-5 0,-5 Z" />
      <path class="fill-terracotta ink-line" d="M 0,-5 C 25,-25 45,-5 20,10 C 10,15 0,-5 0,-5 Z" />
      <circle cx="0" cy="-5" r="6" fill="#2C2825" />
      <!-- Ribbon Tails -->
      <path class="ink-line" d="M -3,0 C -12,25 -25,45 -35,55" />
      <path class="ink-line" d="M 3,0 C 10,25 20,45 28,55" />
    </g>

    <!-- LITTLE FLYING BUTTERFLY -->
    <g transform="translate(210, 110) rotate(-15)">
      <path d="M 0,0 C -15,-18 -25,-2 -5,3 C -20,12 -12,22 0,0 Z" fill="#F2CC8F" class="ink-thin" />
      <path d="M 0,0 C 15,-18 25,-2 5,3 C 20,12 12,22 0,0 Z" fill="#F2CC8F" class="ink-thin" />
      <line x1="0" y1="-5" x2="0" y2="8" class="ink-thick" />
      <!-- Antennae -->
      <path d="M 0,-5 Q -5,-12 -8,-10" class="ink-thin" />
      <path d="M 0,-5 Q 5,-12 8,-10" class="ink-thin" />
    </g>

  </g>
</svg>

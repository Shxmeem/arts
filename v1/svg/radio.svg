<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Sketchy Line Filter for Hand-Drawn Doodle Vibe -->
    <filter id="sketch-rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <style>
      .ink-line { stroke: #2C2825; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ink-thin { stroke: #2C2825; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ink-thick { stroke: #2C2825; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      
      .fill-body { fill: #F4A261; }
      .fill-speaker { fill: #3D3835; }
      .fill-accent { fill: #E07A5F; }
      .fill-dial { fill: #E9C46A; }
      .fill-screen { fill: #FCF9F2; }
    </style>
  </defs>

  <g filter="url(#sketch-rough)">

    <!-- SPARKLES & MUSIC NOTES -->
    <g transform="translate(420, 90) rotate(15)">
      <path class="ink-line" d="M 0,25 L 0,0 L 20,-5 L 20,20" />
      <circle cx="-5" cy="25" r="6" fill="#2C2825" />
      <circle cx="15" cy="20" r="6" fill="#2C2825" />
      <path class="ink-thick" d="M 0,0 L 20,-5" />
    </g>

    <g transform="translate(150, 100) rotate(-20)">
      <path class="ink-line" d="M 0,20 L 0,0 L 12,-3" />
      <circle cx="-5" cy="20" r="5" fill="#2C2825" />
    </g>

    <path class="ink-thin" d="M 110,130 Q 110,142 98,142 Q 110,142 110,154 Q 110,142 122,142 Q 110,142 110,130 Z" fill="#2C2825" opacity="0.8" />
    <path class="ink-thin" d="M 480,140 Q 480,152 468,152 Q 480,152 480,164 Q 480,152 492,152 Q 480,152 480,140 Z" fill="#2C2825" opacity="0.8" />
    <path d="M 120,380 C 120,372 110,368 104,375 C 98,368 88,372 88,380 C 88,390 104,398 104,398 C 104,398 120,390 120,380 Z" fill="#E07A5F" stroke="#2C2825" stroke-width="2.5" stroke-linejoin="round" />

    <!-- BASE SHADOW -->
    <ellipse cx="300" cy="450" rx="180" ry="16" fill="#2C2825" opacity="0.15" />

    <!-- TELESCOPING ANTENNA -->
    <path class="ink-line" d="M 200,200 L 110,80" />
    <circle cx="106" cy="75" r="6" fill="#E07A5F" class="ink-line" />
    <circle cx="170" cy="160" r="3" fill="#2C2825" />
    <circle cx="140" cy="120" r="2.5" fill="#2C2825" />

    <!-- CARRYING HANDLE -->
    <path class="ink-thick" d="M 180,200 L 180,150 C 180,135 420,135 420,150 L 420,200" fill="none" />

    <!-- MAIN RADIO BODY -->
    <rect x="135" y="200" width="330" height="220" rx="28" class="ink-thick" fill="#F4A261" />

    <!-- SPEAKER GRILLE -->
    <circle cx="230" cy="310" r="70" class="ink-thick" fill="#3D3835" />
    <circle cx="230" cy="310" r="58" class="ink-line" fill="none" stroke="#2C2825" />
    <path class="ink-thin" d="M 180,310 L 280,310" stroke="#FCF9F2" opacity="0.4" />
    <path class="ink-thin" d="M 230,260 L 230,360" stroke="#FCF9F2" opacity="0.4" />
    <path class="ink-thin" d="M 195,275 L 265,345" stroke="#FCF9F2" opacity="0.4" />
    <path class="ink-thin" d="M 195,345 L 265,275" stroke="#FCF9F2" opacity="0.4" />
    <circle cx="230" cy="310" r="18" fill="#2C2825" class="ink-thin" />

    <!-- TUNING DIAL SCREEN -->
    <rect x="330" y="235" width="105" height="55" rx="10" class="ink-line" fill="#FCF9F2" />
    <line x1="342" y1="250" x2="423" y2="250" class="ink-thin" stroke-dasharray="3,3" />
    <line x1="342" y1="270" x2="423" y2="270" class="ink-thin" stroke-dasharray="3,3" />
    <line x1="385" y1="242" x2="385" y2="278" stroke="#E07A5F" stroke-width="3.5" stroke-linecap="round" />

    <!-- CONTROL KNOBS -->
    <circle cx="355" cy="345" r="22" class="ink-thick" fill="#E9C46A" />
    <line x1="355" y1="325" x2="355" y2="340" class="ink-thin" />

    <circle cx="410" cy="345" r="22" class="ink-thick" fill="#E9C46A" />
    <line x1="410" y1="345" x2="425" y2="335" class="ink-thin" />

    <!-- BUTTONS & INDICATORS -->
    <circle cx="340" cy="390" r="5" fill="#E07A5F" class="ink-thin" />
    <circle cx="360" cy="390" r="5" fill="#81B29A" class="ink-thin" />
    <circle cx="380" cy="390" r="5" fill="#2C2825" class="ink-thin" />

    <!-- FOOT PADS -->
    <rect x="170" y="420" width="30" height="10" rx="3" fill="#2C2825" />
    <rect x="400" y="420" width="30" height="10" rx="3" fill="#2C2825" />

  </g>
</svg>

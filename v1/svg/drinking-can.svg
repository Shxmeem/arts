<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Sketchy Line Filter for Hand-Drawn Doodle Vibe -->
    <filter id="sketch-rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <style>
      .ink-line { stroke: #2C2825; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ink-thin { stroke: #2C2825; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ink-thick { stroke: #2C2825; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      
      .fill-pepsi-blue { fill: #005B94; }
      .fill-pepsi-red { fill: #E32219; }
      .fill-silver { fill: #E5E5E5; }
      .fill-white { fill: #FCF9F2; }
    </style>
  </defs>

  <g filter="url(#sketch-rough)">

    <!-- BUBBLES & SPARKLES -->
    <circle cx="270" cy="110" r="5" class="ink-thin" fill="#FCF9F2" />
    <circle cx="285" cy="85" r="7" class="ink-thin" fill="#FCF9F2" />
    <circle cx="310" cy="70" r="4" class="ink-thin" fill="#FCF9F2" />
    <circle cx="330" cy="95" r="6" class="ink-thin" fill="#FCF9F2" />
    <circle cx="345" cy="120" r="3" fill="#2C2825" />

    <path class="ink-thin" d="M 140,160 Q 140,172 128,172 Q 140,172 140,184 Q 140,172 152,172 Q 140,172 140,160 Z" fill="#2C2825" opacity="0.8" />
    <path class="ink-thin" d="M 460,280 Q 460,292 448,292 Q 460,292 460,304 Q 460,292 472,292 Q 460,292 460,280 Z" fill="#2C2825" opacity="0.8" />
    <path d="M 135,380 C 135,372 125,368 119,375 C 113,368 103,372 103,380 C 103,390 119,398 119,398 C 119,398 135,390 135,380 Z" fill="#E32219" stroke="#2C2825" stroke-width="2.5" stroke-linejoin="round" />

    <!-- BASE SHADOW -->
    <ellipse cx="300" cy="520" rx="90" ry="12" fill="#2C2825" opacity="0.15" />

    <!-- CAN TOP RIM & PULL TAB -->
    <ellipse cx="300" cy="160" rx="85" ry="24" class="ink-thick" fill="#E5E5E5" />
    <ellipse cx="300" cy="160" rx="72" ry="18" class="ink-thin" fill="#CCCCCC" />

    <g transform="translate(300, 155)">
      <ellipse cx="-10" cy="-2" rx="14" ry="8" class="ink-thin" fill="#E5E5E5" />
      <circle cx="-16" cy="-2" r="4" fill="#2C2825" />
      <circle cx="2" cy="-2" r="3" class="ink-thin" fill="#2C2825" />
    </g>

    <!-- CAN BODY -->
    <path d="M 215,160 L 215,480 C 215,498 385,498 385,480 L 385,160 Z" fill="#005B94" />

    <!-- CAN BOTTOM RIM -->
    <path d="M 215,480 C 215,502 385,502 385,480" class="ink-thick" fill="#E5E5E5" />
    <path d="M 225,480 C 225,494 375,494 375,480" class="ink-thin" />

    <!-- CAN OUTLINE STROKES -->
    <line x1="215" y1="160" x2="215" y2="480" class="ink-thick" />
    <line x1="385" y1="160" x2="385" y2="480" class="ink-thick" />

    <!-- PEPSI GLOBE LOGO -->
    <g transform="translate(300, 310)">
      <clipPath id="globe-clip">
        <circle cx="0" cy="0" r="60" />
      </clipPath>

      <circle cx="0" cy="0" r="60" fill="#FCF9F2" class="ink-thick" />

      <g clip-path="url(#globe-clip)">
        <path d="M -65,-65 L 65,-65 L 65,5 C 20,-15 -20,20 -65,-5 Z" fill="#E32219" />
        <path d="M -65,65 L 65,65 L 65,18 C 20,2 -20,38 -65,12 Z" fill="#005B94" />
      </g>

      <circle cx="0" cy="0" r="60" class="ink-line" fill="none" />
    </g>

    <!-- PEPSI TEXT LOGO -->
    <g transform="translate(300, 420)">
      <text x="0" y="0" text-anchor="middle" font-family="'Comic Sans MS', 'Caveat', cursive, sans-serif" font-weight="900" font-size="38" font-style="italic" letter-spacing="4" fill="#FCF9F2" stroke="#2C2825" stroke-width="3" paint-order="stroke fill">drink</text>
    </g>

    <!-- HIGHLIGHTS & CONDENSATION DROPS -->
    <path d="M 230,190 Q 228,320 230,450" class="ink-thin" stroke="#FCF9F2" opacity="0.6" stroke-width="4" />

    <ellipse cx="245" cy="220" rx="3" ry="5" fill="#FCF9F2" opacity="0.8" class="ink-thin" />
    <ellipse cx="360" cy="260" rx="4" ry="6" fill="#FCF9F2" opacity="0.8" class="ink-thin" />
    <ellipse cx="240" cy="380" rx="3" ry="5" fill="#FCF9F2" opacity="0.8" class="ink-thin" />
    <ellipse cx="365" cy="410" rx="4" ry="6" fill="#FCF9F2" opacity="0.8" class="ink-thin" />

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Sketchy Line Filter for Hand-Drawn Doodle Feel -->
    <filter id="sketch-rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <style>
      .ink-line {
        stroke: #2C2825;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .ink-thin {
        stroke: #2C2825;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .ink-thick {
        stroke: #2C2825;
        stroke-width: 5.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .fill-accent {
        fill: #E07A5F;
      }
      .fill-yellow {
        fill: #F4A261;
      }
      .fill-soft {
        fill: #EAE3D2;
      }
    </style>
  </defs>

  <!-- Filtered Main Group for Hand-Drawn / Doodle Vibe -->
  <g filter="url(#sketch-rough)">

    <!-- SPARKLES & FLASH RAYS (Doodle Accents) -->
    <!-- Flash Rays top right -->
    <path class="ink-thin" d="M 410,100 L 425,80" />
    <path class="ink-thin" d="M 430,115 L 455,105" />
    <path class="ink-thin" d="M 435,135 L 460,140" />

    <!-- Sparkle Stars -->
    <!-- Star 1 (Top Left) -->
    <path class="ink-thin" d="M 120,100 Q 120,115 105,115 Q 120,115 120,130 Q 120,115 135,115 Q 120,115 120,100 Z" fill="#2C2825" opacity="0.8" />
    <!-- Star 2 (Bottom Right) -->
    <path class="ink-thin" d="M 470,360 Q 470,372 458,372 Q 470,372 470,384 Q 470,372 482,372 Q 470,372 470,360 Z" fill="#2C2825" opacity="0.8" />
    
    <!-- Little Hearts & Dots -->
    <path d="M 140,360 C 140,352 130,348 124,355 C 118,348 108,352 108,360 C 108,370 124,378 124,378 C 124,378 140,370 140,360 Z" fill="#E07A5F" stroke="#2C2825" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="485" cy="190" r="4" fill="#2C2825" />
    <circle cx="105" cy="220" r="3" fill="#2C2825" />

    <!-- CAMERA STRAP LUGS -->
    <path class="ink-line" d="M 135,230 C 120,230 115,250 135,255" />
    <path class="ink-line" d="M 465,230 C 480,230 485,250 465,255" />
    <!-- Strap rings -->
    <ellipse cx="120" cy="242" rx="4" ry="7" class="ink-thin" />
    <ellipse cx="480" cy="242" rx="4" ry="7" class="ink-thin" />

    <!-- TOP BUTTONS & DIALS -->
    <!-- Left Dial -->
    <rect x="180" y="155" width="30" height="15" rx="3" class="ink-line" fill="#EAE3D2" />
    <line x1="190" y1="155" x2="190" y2="162" class="ink-thin" />
    <line x1="200" y1="155" x2="200" y2="162" class="ink-thin" />

    <!-- Shutter Button (Right Side) -->
    <path class="ink-line" d="M 370,170 L 370,152 C 370,148 395,148 395,152 L 395,170" fill="#EAE3D2" />
    <line x1="375" y1="158" x2="390" y2="158" class="ink-thin" />

    <!-- Flash Housing Bump (Center-Top) -->
    <path class="ink-thick" d="M 255,170 L 265,145 C 267,140 273,138 280,138 L 320,138 C 327,138 333,140 335,145 L 345,170" fill="#FCF9F2" />
    <!-- Hotshoe mount detail -->
    <path class="ink-thin" d="M 285,138 L 285,132 L 315,132 L 315,138" />

    <!-- MAIN CAMERA BODY -->
    <!-- Outer Body Silhouette with rounded corners -->
    <rect x="135" y="170" width="330" height="210" rx="28" class="ink-thick" fill="#FCF9F2" />
    
    <!-- Top Decorative Leatherband Cut / Accent Line -->
    <path class="ink-line" d="M 136,220 C 230,222 370,218 464,220" />
    <path class="ink-thin" stroke-dasharray="6,5" d="M 140,226 C 240,228 360,224 460,226" />

    <!-- Red Dot Accent (Minimalist Brand Node) -->
    <circle cx="175" cy="196" r="7" fill="#E07A5F" stroke="#2C2825" stroke-width="2.5" />

    <!-- Viewfinder Window (Top Right) -->
    <rect x="390" y="188" width="34" height="22" rx="5" class="ink-line" fill="#2C2825" />
    <rect x="394" y="192" width="26" height="14" rx="3" fill="#FCF9F2" class="ink-thin" />
    <!-- Viewfinder Glare -->
    <line x1="412" y1="193" x2="402" y2="205" class="ink-thin" />

    <!-- Small Sensor / Self-Timer Light -->
    <circle cx="365" cy="198" r="5" class="ink-line" fill="#F4A261" />

    <!-- Grip Texture / Lines on Left -->
    <path class="ink-thin" d="M 158,250 C 156,290 156,330 158,350" />

    <!-- MAIN LENS ASSEMBLY (Concentric Minimalist Circles) -->
    <!-- Outer Ring Base Shadow -->
    <circle cx="300" cy="285" r="82" class="ink-thick" fill="#EAE3D2" />
    
    <!-- Ridge pattern on outer lens ring -->
    <circle cx="300" cy="285" r="74" class="ink-line" fill="#FCF9F2" />
    <circle cx="300" cy="285" r="68" class="ink-thin" />

    <!-- Aperture / Inner Ring -->
    <circle cx="300" cy="285" r="54" class="ink-line" fill="#2C2825" />
    <circle cx="300" cy="285" r="44" class="ink-thin" fill="#3D3835" />

    <!-- Glass Reflection Highlights (Doodle Arcs) -->
    <path d="M 270,255 A 38 38 0 0 1 330,255 A 32 32 0 0 0 270,255 Z" fill="#FCF9F2" opacity="0.85" />
    <circle cx="320" cy="305" r="5" fill="#FCF9F2" opacity="0.7" />
    <circle cx="330" cy="295" r="2.5" fill="#FCF9F2" opacity="0.7" />

    <!-- Lens Spec Text Doodle (50mm f/1.4) -->
    <path class="ink-thin" d="M 260,285 A 40 40 0 0 1 300,245" stroke-dasharray="2,3" />

    <!-- Small Floating Photo Frame (Doodle Pop-out) -->
    <g transform="translate(420, 310) rotate(12)">
      <rect x="0" y="0" width="55" height="65" rx="4" class="ink-line" fill="#FCF9F2" />
      <rect x="6" y="6" width="43" height="42" class="ink-thin" fill="#EAE3D2" />
      <!-- Tiny Sun & Mountain in Polaroid -->
      <path class="ink-thin" d="M 10,42 L 22,28 L 32,38 L 40,32 L 46,42" />
      <circle cx="38" cy="16" r="3" fill="#F4A261" />
    </g>

  </g>
</svg>

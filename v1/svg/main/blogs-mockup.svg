<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <!-- Simple doodle filters for hand-drawn / sketchy line effect -->
    <filter id="doodle-rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <style>
    /* Styles for the doodle look */
    .sketch { stroke: #333; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .filled-sketch { fill: #f8f9fa; stroke: #333; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .filled-cream { fill: #fffdf5; stroke: #333; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .accent { fill: #007bff; stroke: none; }
    .accent-stroke { stroke: #007bff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    
    /* Fonts with a hand-written / courier feel */
    .text { font-family: 'Courier New', Courier, monospace; fill: #333; }
    .meta-text { font-family: 'Courier New', Courier, monospace; fill: #888; }
    .link { font-family: 'Courier New', Courier, monospace; fill: #007bff; font-weight: bold; }
    .tag-text { font-family: 'Courier New', Courier, monospace; fill: #555; }
    .button-text { font-family: 'Courier New', Courier, monospace; fill: white; font-weight: bold; text-anchor: middle; }
    
    .shadow { filter: drop-shadow(3px 3px 2px rgba(0,0,0,0.1)); }
  </style>

  <g filter="url(#doodle-rough)">
    <!-- Browser Frame (Simplified) -->
    <rect x="50" y="50" width="800" height="500" rx="10" ry="10" class="filled-cream sketch shadow"/>
    <rect x="50" y="50" width="800" height="35" rx="10" ry="10" fill="#f0f0f0" class="sketch"/>
    
    <!-- Window Buttons -->
    <circle cx="70" cy="67.5" r="6" fill="#ff5f56"/>
    <circle cx="90" cy="67.5" r="6" fill="#ffbd2e"/>
    <circle cx="110" cy="67.5" r="6" fill="#28c93f"/>

    <!-- simplified URL area -->
    <rect x="150" y="58" width="600" height="18" rx="5" ry="5" class="filled-sketch"/>
    <text x="160" y="72" class="meta-text" font-size="12">my-store.qxel.in/blog/my-first-sale</text>

    <!-- Navigation Bar (Simplified) -->
    <text x="70" y="115" class="text" font-size="26" font-weight="bold">Little Creator</text>
    <text x="630" y="115" class="text" font-size="16">Home</text>
    <text x="700" y="115" class="link" font-size="16">blogs</text>
    <text x="770" y="115" class="text" font-size="16">products</text>
    <line x1="70" y1="135" x2="830" y2="135" class="sketch" stroke-width="1.5" stroke="#ccc"/>

    <!-- Main Content Area -->
    <g transform="translate(70, 160)">
      <!-- Blog Column (Left, Simplified) -->
      <g>
        <!-- Title -->
        <text x="0" y="30" class="text" font-size="36" font-weight="bold">My First Sale</text>
        
        <!-- Meta Info -->
        <text x="0" y="65" class="meta-text" font-size="14">by Alex Rivera | August 10, 2026</text>
        <rect x="250" y="53" width="70" height="18" rx="9" fill="#007bff" />
        <text x="285" y="66" class="button-text" font-size="10">Adventures</text>

        <!-- Featured Image Placeholder (Simplified Doodle) -->
        <rect x="0" y="90" width="480" height="220" rx="8" ry="8" class="filled-sketch shadow"/>
        <!-- Simplified Landscape Doodle -->
        <path d="M 60,180 q 150,-130 300,0 q 100,50 -100,100 q -200,-50 -200,-100 z" class="sketch" fill="#adb5bd" fill-opacity="0.2"/>
        <text x="240" y="200" class="text" font-size="18" fill="#666" text-anchor="middle">Image Placeholder</text>

        <!-- Blog Post Content (Reduced wavy lines) -->
        <path d="M 0,340 q 20,10 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0" class="sketch" stroke-width="1.5" stroke="#666"/>
        <path d="M 0,365 q 20,10 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0" class="sketch" stroke-width="1.5" stroke="#666"/>
        <path d="M 0,390 q 20,10 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0 t 40,0" class="sketch" stroke-width="1.5" stroke="#666"/>
        
        <!-- Simplified like share -->
        <g transform="translate(0, 420)">
           <circle cx="20" cy="15" r="12" class="accent-stroke" fill="white"/>
           <path d="M 17,20 l 3,-3 l 3,3" class="accent-stroke" stroke-width="1.5"/>
           <text x="45" y="20" class="meta-text" font-size="12">1.2k Likes</text>
        </g>
      </g>

      <!-- Sidebar (Right, Simplified) -->
      <g transform="translate(530, 0)">
        <!-- Search -->
        <text x="0" y="30" class="text" font-size="22" font-weight="bold">Search</text>
        <rect x="0" y="45" width="230" height="40" rx="8" ry="8" class="filled-sketch shadow"/>
        <text x="15" y="70" class="meta-text" font-size="14">Type here...</text>
        <circle cx="205" cy="65" r="9" class="accent-stroke" stroke-width="1.5"/>
        <line x1="210" y1="70" x2="218" y2="78" class="accent-stroke" stroke-width="1.5"/>

        <!-- Categories -->
        <text x="0" y="120" class="text" font-size="22" font-weight="bold">Categories</text>
        <rect x="0" y="140" width="230" height="110" rx="8" ry="8" class="filled-cream sketch"/>
        <text x="15" y="170" class="tag-text" font-size="16">• Sales</text>
        <text x="15" y="200" class="tag-text" font-size="16">• Reviews</text>
        <text x="15" y="230" class="tag-text" font-size="16">• Targets Tips</text>
      </g>
    </g>

    <!-- Footer (Simplified) -->
    <line x1="50" y1="535" x2="850" y2="535" class="sketch" stroke-width="1.5" stroke="#ccc"/>
    <text x="450" y="565" class="text" font-size="12" text-anchor="middle">© 2026 Travel Doodles</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .stroke-main { stroke: #1a1a1a; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .stroke-thin { stroke: #1a1a1a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .stroke-thick { stroke: #1a1a1a; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fill-white { fill: #ffffff; }
      .fill-dark { fill: #1a1a1a; }
      .text-doodle { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Caveat', 'Comic Neue', sans-serif, cursive; font-weight: bold; fill: #1a1a1a; }
    </style>
    <!-- Hand-drawn distortion filter for doodle feel -->
    <filter id="doodle-paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <g filter="url(#doodle-paper)">
    <!-- Outer Browser UI Window -->
    <!-- Window Frame -->
    <path class="stroke-thick fill-white" d="M 102 82 C 250 78, 950 81, 1098 83 C 1104 220, 1097 480, 1100 618 C 920 622, 280 617, 100 620 C 97 480, 103 220, 102 82 Z" />
    
    <!-- Window Header Line -->
    <path class="stroke-main" d="M 101 138 C 400 136, 800 140, 1099 137" />

    <!-- Browser Window Controls (Three Dots) -->
    <circle cx="132" cy="110" r="7" class="stroke-main fill-dark" />
    <circle cx="157" cy="110" r="7" class="stroke-main fill-dark" />
    <circle cx="182" cy="110" r="7" class="stroke-main fill-dark" />

    <!-- Address / Search Bar -->
    <path class="stroke-main fill-white" d="M 222 100 C 400 97, 800 102, 988 99 C 998 110, 995 118, 989 122 C 800 120, 400 124, 221 121 C 215 112, 217 105, 222 100 Z" />
    <!-- Search Icon -->
    <circle cx="242" cy="110" r="6" class="stroke-thin" />
    <path class="stroke-thin" d="M 246 114 L 254 121" />
    <!-- URL Text -->
    <text x="268" y="115" class="text-doodle" font-size="14" opacity="0.6">https://my-store.com/dashboard/files</text>

    <!-- Navigation Tabs -->
    <path class="stroke-main" d="M 140 138 L 140 168 C 190 170, 210 166, 250 168 L 250 138" />
    <text x="163" y="158" class="text-doodle" font-size="16">Library</text>

    <path class="stroke-main" d="M 270 138 L 270 168 C 320 166, 340 170, 380 168 L 380 138" />
    <text x="295" y="158" class="text-doodle" font-size="16">Upload</text>

    <path class="stroke-thick" d="M 400 138 L 400 172 C 450 170, 480 174, 530 172 L 530 138" />
    <text x="420" y="160" class="text-doodle" font-size="18">My Files</text>

    <!-- Content Divider Line -->
    <path class="stroke-thin" d="M 101 172 L 1099 172" />

    <!-- MAIN CONTENT AREA (Centered / Left Aligned Content) -->

    <!-- PDF Icon Card Container -->
    <g transform="translate(260, 220)">
      <!-- PDF Document Outline -->
      <path class="stroke-thick fill-white" d="M 30 10 C 120 8, 180 12, 220 10 C 240 30, 260 50, 270 70 C 268 180, 272 290, 270 330 C 180 334, 100 328, 30 330 C 28 230, 32 110, 30 10 Z" />
      
      <!-- Folded Corner -->
      <path class="stroke-thick fill-white" d="M 220 10 L 220 70 L 270 70 Z" />

      <!-- PDF Text Inside Document -->
      <text x="75" y="155" class="text-doodle" font-size="72" letter-spacing="4">PDF</text>
      
      <!-- Decorative Lines in PDF -->
      <path class="stroke-main" d="M 70 195 C 130 193, 180 197, 230 195" />
      <path class="stroke-main" d="M 70 225 C 120 227, 160 223, 210 225" />
      <path class="stroke-main" d="M 70 255 C 110 253, 150 257, 180 255" />

      <!-- File Name below PDF -->
      <text x="150" y="375" class="text-doodle" font-size="24" text-anchor="middle">LESSON_PLAN.pdf</text>
      <text x="150" y="405" class="text-doodle" font-size="16" fill="#666666" text-anchor="middle">Size: 2.4 MB • Updated Today</text>
    </g>

    <!-- Right Side Dashboard Details / Metadata Panel -->
    <g transform="translate(620, 230)">
      <!-- File Information Box -->
      <path class="stroke-main fill-white" d="M 10 10 C 130 12, 250 8, 370 10 C 372 80, 368 160, 370 210 C 250 212, 130 208, 10 210 C 8 130, 12 70, 10 10 Z" />
      
      <text x="30" y="45" class="text-doodle" font-size="22">Document Details</text>
      <path class="stroke-thin" d="M 30 55 L 350 55" />

      <text x="30" y="90" class="text-doodle" font-size="16">Status: <tspan fill="#008000">Ready to Publish</tspan></text>
      <text x="30" y="125" class="text-doodle" font-size="16">Access: Private (Draft)</text>
      <text x="30" y="160" class="text-doodle" font-size="16">Suggested Price: $9.99</text>

      <!-- Doodle SELL Button -->
      <g transform="translate(30, 250)">
        <!-- Sparkles / Action lines around Sell Button -->
        <path class="stroke-main" d="M -15 15 L -5 25" />
        <path class="stroke-main" d="M -20 45 L -8 45" />
        <path class="stroke-main" d="M -12 75 L -2 65" />
        <path class="stroke-main" d="M 285 -10 L 275 2" />
        <path class="stroke-main" d="M 300 45 L 288 45" />

        <!-- Button Outer Box -->
        <path class="stroke-thick fill-white" d="M 10 5 C 90 2, 180 8, 260 5 C 272 15, 268 65, 270 80 C 180 84, 90 77, 10 80 C 6 60, 12 25, 10 5 Z" />
        
        <!-- Drop Shadow Effect for Button (Doodle style) -->
        <path class="stroke-thick" d="M 270 15 C 278 25, 276 70, 278 88 C 200 90, 100 87, 20 88" />

        <!-- SELL Text -->
        <text x="135" y="54" class="text-doodle" font-size="38" text-anchor="middle" letter-spacing="3">SELL</text>
      </g>

      <!-- Mouse Cursor pointing at Sell Button -->
      <g transform="translate(210, 310)">
        <!-- Hand Drawn Mouse Pointer Arrow -->
        <path class="stroke-thick fill-white" d="M 0 0 L 0 50 L 14 38 L 28 62 L 40 56 L 26 32 L 44 32 Z" />
        <!-- Click Ripple / Burst lines -->
        <path class="stroke-main" d="M -12 -12 L -4 -4" />
        <path class="stroke-main" d="M 15 -20 L 15 -10" />
        <path class="stroke-main" d="M -20 15 L -10 15" />
      </g>
    </g>

    <!-- Footer of UI -->
    <path class="stroke-thin" d="M 101 575 C 400 573, 800 577, 1099 575" />
    <text x="130" y="602" class="text-doodle" font-size="14" opacity="0.7">Footer • 1 item selected • Ready</text>
    <text x="1000" y="602" class="text-doodle" font-size="14" opacity="0.7">Zoom: 100%</text>
  </g>
</svg>

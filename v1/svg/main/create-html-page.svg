<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Hand-drawn line filter (roughness effect) -->
    <filter id="sketch-filter" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <style>
      .sketch-line {
        stroke: #222222;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        filter: url(#sketch-filter);
      }
      .sketch-thin {
        stroke: #222222;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        filter: url(#sketch-filter);
      }
      .code-tag {
        fill: #d9534f;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        font-size: 18px;
      }
      .code-attr {
        fill: #f0ad4e;
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
      }
      .code-val {
        fill: #5cb85c;
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
      }
      .code-text {
        fill: #333333;
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
      }
      .code-comment {
        fill: #777777;
        font-family: 'Courier New', Courier, monospace;
        font-style: italic;
        font-size: 16px;
      }
      .doodle-fill {
        fill: #222222;
      }
      .window-bg {
        fill: #ffffff;
        fill-opacity: 0.95;
      }
    </style>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Outer Window Shadow / Double Sketch Line -->
    <path class="sketch-thin" d="M 145 65 L 655 65 A 15 15 0 0 1 670 80 L 670 525 A 15 15 0 0 1 655 540 L 145 540 A 15 15 0 0 1 130 525 L 130 80 A 15 15 0 0 1 145 65 Z" opacity="0.4" />

    <!-- Window Background -->
    <rect class="window-bg" x="135" y="70" width="530" height="460" rx="12" ry="12" />

    <!-- Main Window Frame -->
    <path class="sketch-line" d="M 148 70 L 652 70 A 12 12 0 0 1 665 82 L 665 518 A 12 12 0 0 1 652 530 L 148 530 A 12 12 0 0 1 135 518 L 135 82 A 12 12 0 0 1 148 70 Z" />

    <!-- Header Divider -->
    <path class="sketch-line" d="M 135 115 L 665 115" />

    <!-- Window Control Buttons (Doodle style) -->
    <!-- Close -->
    <circle class="sketch-line" cx="165" cy="92" r="6" />
    <path class="sketch-thin" d="M 162 89 L 168 95 M 168 89 L 162 95" />
    
    <!-- Minimize -->
    <circle class="sketch-line" cx="187" cy="92" r="6" />
    <path class="sketch-thin" d="M 184 92 L 190 92" />
    
    <!-- Maximize -->
    <circle class="sketch-line" cx="209" cy="92" r="6" />
    <rect class="sketch-thin" x="206" y="89" width="6" height="6" />

    <!-- Window Title Tab -->
    <path class="sketch-line" d="M 280 115 L 290 80 L 510 80 L 520 115" />
    <text x="400" y="101" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="16" fill="#333" text-anchor="middle">index.html</text>

    <!-- Code Content -->
    <g transform="translate(165, 130)">
      <!-- Line 1: Doctype -->
      <text y="20">
        <tspan class="code-tag">&lt;!DOCTYPE html&gt;</tspan>
      </text>

      <!-- Line 2: html opening -->
      <text y="45">
        <tspan class="code-tag">&lt;html&gt;</tspan>
      </text>

      <!-- Line 3: head opening -->
      <text y="70" x="20">
        <tspan class="code-tag">&lt;head&gt;</tspan>
      </text>

      <!-- Line 4: title -->
      <text y="95" x="40">
        <tspan class="code-tag">&lt;title&gt;</tspan>
        <tspan class="code-text">My Doodle</tspan>
        <tspan class="code-tag">&lt;/title&gt;</tspan>
      </text>

      <!-- Line 5: head closing -->
      <text y="120" x="20">
        <tspan class="code-tag">&lt;/head&gt;</tspan>
      </text>

      <!-- Line 6: body opening -->
      <text y="145">
        <tspan class="code-tag">&lt;body&gt;</tspan>
      </text>

      <!-- Line 7: h1 tag -->
      <text y="170" x="20">
        <tspan class="code-tag">&lt;h1&gt;</tspan>
        <tspan class="code-text">Hello World!</tspan>
        <tspan class="code-tag">&lt;/h1&gt;</tspan>
      </text>

      <!-- Line 8: p tag -->
      <text y="195" x="20">
        <tspan class="code-tag">&lt;p&gt;</tspan>
        <tspan class="code-text">Website Code</tspan>
        <tspan class="code-tag">&lt;/p&gt;</tspan>
      </text>

      <!-- Line 9: img tag -->
      <text y="220" x="20">
        <tspan class="code-tag">&lt;img</tspan>
        <tspan class="code-attr"> src=</tspan><tspan class="code-val">"pic.png"</tspan>
        <tspan class="code-tag">&gt;</tspan>
      </text>

      <!-- Line 10: Comment -->
      <text y="250" x="20">
        <tspan class="code-comment">&lt;!-- Hero Section--&gt;</tspan>
      </text>

      <!-- Line 11: body closing -->
      <text y="280">
        <tspan class="code-tag">&lt;/body&gt;</tspan>
      </text>

      <!-- Line 12: html closing -->
      <text y="305">
        <tspan class="code-tag">&lt;/html&gt;</tspan>
      </text>
    </g>
  </g>
</svg>

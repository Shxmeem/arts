<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 600">
  <defs>
    <filter id="sketch-filter" width="120%" height="120%" x="-10%" y="-10%">
      <feTurbulence baseFrequency=".04" numOctaves="3" result="noise" type="fractalNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .sketch-line,.sketch-thin{stroke:#222;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;fill:none;filter:url(#sketch-filter)}
      .sketch-thin{stroke-width:2.5}
      .code-attr{font-size:18px}
      .code-attr,.code-comment,.code-tag,.code-text,.code-val{font-family:'Courier New',Courier,monospace}
      .code-tag,.code-text,.code-val{font-size:18px}
      .code-tag{fill:#d9534f;font-weight:700}
      .code-attr{fill:#f0ad4e}
      .code-val{fill:#5cb85c}
      .code-text{fill:#333}
      .code-comment{fill:#777;font-style:italic;font-size:16px}
      .window-bg{fill:#fff;fill-opacity:.95}
    </style>
  </defs>
  <g transform="translate(0, 0)">
    <path d="M 145 65 L 655 65 A 15 15 0 0 1 670 80 L 670 525 A 15 15 0 0 1 655 540 L 145 540 A 15 15 0 0 1 130 525 L 130 80 A 15 15 0 0 1 145 65 Z" class="sketch-thin" opacity=".4"/>
    <rect width="530" height="460" x="135" y="70" class="window-bg" rx="12" ry="12"/>
    <path d="M 148 70 L 652 70 A 12 12 0 0 1 665 82 L 665 518 A 12 12 0 0 1 652 530 L 148 530 A 12 12 0 0 1 135 518 L 135 82 A 12 12 0 0 1 148 70 Z" class="sketch-line"/>
    <path d="M 135 115 L 665 115" class="sketch-line"/>
    <circle cx="165" cy="92" r="6" class="sketch-line"/>
    <path d="M 162 89 L 168 95 M 168 89 L 162 95" class="sketch-thin"/>
    <circle cx="187" cy="92" r="6" class="sketch-line"/>
    <path d="M 184 92 L 190 92" class="sketch-thin"/>
    <circle cx="209" cy="92" r="6" class="sketch-line"/>
    <rect width="6" height="6" x="206" y="89" class="sketch-thin"/>
    <path d="M 280 115 L 290 80 L 510 80 L 520 115" class="sketch-line"/>
    <text x="400" y="101" fill="#333" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" text-anchor="middle">index.html</text>
    <g>
      <text y="20" transform="translate(165, 130)">
        <tspan class="code-tag">&lt;!DOCTYPE html&gt;</tspan>
      </text>
      <text y="45" transform="translate(165, 130)">
        <tspan class="code-tag">&lt;html&gt;</tspan>
      </text>
      <text x="20" y="70" transform="translate(165, 130)">
        <tspan class="code-tag">&lt;head&gt;</tspan>
      </text>
      <text x="40" y="95" transform="translate(165, 130)">
        <tspan class="code-tag">&lt;title&gt;</tspan> <tspan class="code-text">My Website</tspan> <tspan class="code-tag">&lt;/title&gt;</tspan>
      </text>
      <text x="20" y="120" transform="translate(165, 130)">
        <tspan class="code-tag">&lt;/head&gt;</tspan>
      </text>
      <text y="145" transform="translate(165, 130)">
        <tspan class="code-tag">&lt;body&gt;</tspan>
      </text>
      <text x="20" y="170" transform="translate(165, 130)">
        <tspan class="code-tag">&lt;h1&gt;</tspan> <tspan class="code-text">Hello World!</tspan> <tspan class="code-tag">&lt;/h1&gt;</tspan>
      </text>
      <text x="20" y="195" transform="translate(165, 130)">
        <tspan class="code-tag">&lt;p&gt;</tspan> <tspan class="code-text">Website Code</tspan> <tspan class="code-tag">&lt;/p&gt;</tspan>
      </text>
      <text x="20" y="220" transform="translate(165, 130)">
        <tspan class="code-tag">&lt;img</tspan> <tspan class="code-attr"> src=</tspan><tspan class="code-val">&quot;pic.png&quot;</tspan> <tspan class="code-tag">&gt;</tspan>
      </text>
      <text x="20" y="250" transform="translate(165, 130)">
        <tspan class="code-comment">&lt;!-- Hero Section--&gt;</tspan>
      </text>
      <text y="280" transform="translate(165, 130)">
        <tspan class="code-tag">&lt;/body&gt;</tspan>
      </text>
      <text y="305" transform="translate(165, 130)">
        <tspan class="code-tag">&lt;/html&gt;</tspan>
      </text>
    </g>
  </g>
</svg>

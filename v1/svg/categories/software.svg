<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <g stroke="#1e1e1e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Outer Main IDE / Code Editor Window -->
    <rect x="25" y="25" width="950" height="570" rx="14" ry="12" />
    
    <!-- Title Bar -->
    <line x1="25" y1="70" x2="975" y2="70" />
    <circle cx="50" cy="48" r="5" fill="#1e1e1e" />
    <circle cx="68" cy="48" r="5" fill="#1e1e1e" />
    <circle cx="86" cy="48" r="5" fill="#1e1e1e" />
    <text x="400" y="52" font-family="monospace" font-size="12" fill="#1e1e1e" stroke="none">doodle_ui_editor.config.js — Code &amp; Preview</text>

    <!-- Sidebar / File Explorer Divider -->
    <line x1="200" y1="70" x2="200" y2="595" />
    
    <!-- File Explorer Content -->
    <text x="40" y="95" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">EXPLORER</text>
    
    <!-- Folder & File Items -->
    <path d="M 40 115 L 50 115 L 53 118 L 65 118 L 65 128 L 40 128 Z" />
    <text x="72" y="125" font-family="monospace" font-size="11" fill="#1e1e1e" stroke="none">src/</text>
    
    <path d="M 55 138 L 63 138 L 66 141 L 76 141 L 76 150 L 55 150 Z" />
    <text x="82" y="147" font-family="monospace" font-size="10" fill="#1e1e1e" stroke="none">components/</text>
    
    <text x="95" y="167" font-family="monospace" font-size="10" fill="#1e1e1e" stroke="none">Header.jsx</text>
    <text x="95" y="187" font-family="monospace" font-size="10" fill="#1e1e1e" stroke="none">Button.jsx</text>
    <text x="95" y="207" font-family="monospace" font-size="10" font-weight="bold" fill="#1e1e1e" stroke="none">App.tsx</text>
    <path d="M 85 204 L 90 204" /> <!-- Active File Marker -->

    <path d="M 55 220 L 63 220 L 66 223 L 76 223 L 76 232 L 55 232 Z" />
    <text x="82" y="229" font-family="monospace" font-size="10" fill="#1e1e1e" stroke="none">styles/</text>
    <text x="95" y="249" font-family="monospace" font-size="10" fill="#1e1e1e" stroke="none">main.css</text>

    <!-- Workspace Splitter: Left Code Editor / Right Live Preview -->
    <line x1="560" y1="70" x2="560" y2="595" stroke-dasharray="6,6" />

    <!-- ==================== LEFT PANEL: CODE EDITOR ==================== -->
    <!-- Tab Bar -->
    <rect x="200" y="70" width="120" height="28" fill="none" />
    <text x="215" y="88" font-family="monospace" font-size="11" font-weight="bold" fill="#1e1e1e" stroke="none">App.tsx</text>
    <line x1="200" y1="98" x2="560" y2="98" />

    <!-- Line Numbers -->
    <g font-family="monospace" font-size="11" fill="#1e1e1e" stroke="none" opacity="0.6">
      <text x="212" y="125">1</text>
      <text x="212" y="145">2</text>
      <text x="212" y="165">3</text>
      <text x="212" y="185">4</text>
      <text x="212" y="205">5</text>
      <text x="212" y="225">6</text>
      <text x="212" y="245">7</text>
      <text x="212" y="265">8</text>
      <text x="212" y="285">9</text>
      <text x="208" y="305">10</text>
      <text x="208" y="325">11</text>
      <text x="208" y="345">12</text>
      <text x="208" y="365">13</text>
      <text x="208" y="385">14</text>
    </g>

    <!-- Code Content -->
    <g font-family="monospace" font-size="11" fill="#1e1e1e" stroke="none">
      <text x="235" y="125"><tspan font-weight="bold">import</tspan> React <tspan font-weight="bold">from</tspan> 'react';</text>
      <text x="235" y="145"><tspan font-weight="bold">import</tspan> { Header, Card } <tspan font-weight="bold">from</tspan> './components';</text>
      <text x="235" y="165"></text>
      <text x="235" y="185"><tspan font-weight="bold">export default function</tspan> App() {</text>
      <text x="250" y="205"><tspan font-weight="bold">return</tspan> (</text>
      <text x="265" y="225">&lt;<tspan font-weight="bold">div</tspan> className="app-container"&gt;</text>
      <text x="280" y="245">&lt;<tspan font-weight="bold">Header</tspan> title="Web UI Sketch" /&gt;</text>
      <text x="280" y="265">&lt;<tspan font-weight="bold">main</tspan> className="content"&gt;</text>
      <text x="295" y="285">&lt;<tspan font-weight="bold">Card</tspan> type="Doodle" /&gt;</text>
      <text x="295" y="305">&lt;<tspan font-weight="bold">Button</tspan>&gt;Submit&lt;/<tspan font-weight="bold">Button</tspan>&gt;</text>
      <text x="280" y="325">&lt;/<tspan font-weight="bold">main</tspan>&gt;</text>
      <text x="265" y="345">&lt;/<tspan font-weight="bold">div</tspan>&gt;</text>
      <text x="250" y="365">);</text>
      <text x="235" y="385">}</text>
    </g>

    <!-- Sketchy Cursor in Code -->
    <line x1="395" y1="295" x2="395" y2="308" stroke-width="2" />

    <!-- Terminal Panel (Bottom Left) -->
    <line x1="200" y1="420" x2="560" y2="420" />
    <text x="215" y="440" font-family="monospace" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">TERMINAL — bash</text>
    <text x="215" y="465" font-family="monospace" font-size="11" fill="#1e1e1e" stroke="none">$ npm run dev</text>
    <text x="215" y="485" font-family="monospace" font-size="10" fill="#1e1e1e" stroke="none">> vite dev server running at:</text>
    <text x="215" y="505" font-family="monospace" font-size="10" font-weight="bold" fill="#1e1e1e" stroke="none">> http://localhost:5173/</text>
    <text x="215" y="530" font-family="monospace" font-size="10" fill="#1e1e1e" stroke="none">ready in 240ms.</text>

    <!-- ==================== RIGHT PANEL: LIVE PREVIEW UI ==================== -->
    <!-- Tab Bar -->
    <text x="580" y="88" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e1e1e" stroke="none">LIVE PREVIEW</text>
    <line x1="560" y1="98" x2="975" y2="98" />

    <!-- Rendered Web App Screen Wireframe -->
    <rect x="580" y="115" width="370" height="450" rx="10" />

    <!-- Web App Navbar -->
    <line x1="580" y1="155" x2="950" y2="155" />
    <circle cx="605" cy="135" r="8" />
    <text x="620" y="139" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">Web UI Sketch</text>
    
    <text x="830" y="139" font-family="sans-serif" font-size="10" fill="#1e1e1e" stroke="none">Home</text>
    <text x="870" y="139" font-family="sans-serif" font-size="10" fill="#1e1e1e" stroke="none">Docs</text>
    <rect x="910" y="125" width="30" height="20" rx="4" />

    <!-- Web App Hero Component -->
    <rect x="600" y="175" width="330" height="120" rx="8" />
    <text x="615" y="200" font-family="sans-serif" font-weight="bold" font-size="14" fill="#1e1e1e" stroke="none">Interactive Component</text>
    <text x="615" y="218" font-family="sans-serif" font-size="10" fill="#1e1e1e" stroke="none">Rendered instantly from code on the left side panel.</text>

    <!-- Sketchy Chart / Graphic inside Hero -->
    <path d="M 615 270 L 640 250 L 670 260 L 710 230 L 740 255 L 780 220" stroke-width="2" />
    <circle cx="780" cy="220" r="3" fill="#1e1e1e" />

    <!-- Web App Card Grid -->
    <rect x="600" y="310" width="155" height="130" rx="8" />
    <!-- Doodle Image Placeholder -->
    <rect x="612" y="322" width="131" height="60" rx="4" />
    <path d="M 612 370 L 640 345 L 675 375 L 700 355 L 743 382" />
    <circle cx="720" cy="338" r="4" />
    <text x="612" y="402" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">Doodle Card 1</text>
    <text x="612" y="418" font-family="sans-serif" font-size="9" fill="#1e1e1e" stroke="none">Subtext caption...</text>

    <rect x="775" y="310" width="155" height="130" rx="8" />
    <!-- Code Snippet Box inside Preview Card -->
    <rect x="787" y="322" width="131" height="60" rx="4" />
    <path d="M 797 340 L 807 350 L 797 360" />
    <line x1="812" y1="360" x2="825" y2="360" />
    <text x="787" y="402" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">Doodle Card 2</text>
    <text x="787" y="418" font-family="sans-serif" font-size="9" fill="#1e1e1e" stroke="none">Subtext caption...</text>

    <!-- Web App Action Buttons -->
    <rect x="600" y="460" width="100" height="32" rx="6" />
    <text x="632" y="480" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">Submit</text>

    <rect x="712" y="460" width="100" height="32" rx="6" stroke-dasharray="4,3" />
    <text x="745" y="480" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">Cancel</text>

    <!-- Mouse Cursor Pointer -->
    <path d="M 660 480 L 675 495 L 668 497 L 672 507 L 666 509 L 662 499 L 655 504 Z" fill="#1e1e1e" />

  </g>
</svg>

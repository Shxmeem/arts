<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <g stroke="#1e1e1e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Outer Application Window Frame -->
    <rect x="25" y="25" width="950" height="570" rx="14" ry="12" />
    
    <!-- Title Bar -->
    <line x1="25" y1="70" x2="975" y2="70" />
    <circle cx="50" cy="48" r="5" fill="#1e1e1e" />
    <circle cx="68" cy="48" r="5" fill="#1e1e1e" />
    <circle cx="86" cy="48" r="5" fill="#1e1e1e" />
    <text x="400" y="52" font-family="sans-serif" font-weight="bold" font-size="13" fill="#1e1e1e" stroke="none">Student Portal — Study Materials &amp; Notes</text>

    <!-- Sidebar Divider -->
    <line x1="220" y1="70" x2="220" y2="595" />
    
    <!-- ==================== SIDEBAR: COURSES & MODULES ==================== -->
    <text x="45" y="98" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1e1e1e" stroke="none">MY COURSES</text>
    
    <!-- Course 1 (Active) -->
    <rect x="40" y="112" width="165" height="32" rx="6" stroke-dasharray="2,2" />
    <text x="52" y="132" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">📚 Physics 101</text>
    
    <!-- Course 1 Sub-items -->
    <text x="65" y="160" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e1e1e" stroke="none">▸ Lecture Notes</text>
    <text x="65" y="180" font-family="sans-serif" font-size="10" fill="#1e1e1e" stroke="none">▸ Formula Sheet</text>
    <text x="65" y="200" font-family="sans-serif" font-size="10" fill="#1e1e1e" stroke="none">▸ Practice Quiz</text>

    <!-- Course 2 -->
    <text x="52" y="235" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">📖 Calculus II</text>
    <text x="65" y="258" font-family="sans-serif" font-size="10" fill="#1e1e1e" stroke="none">▸ Integrals Summary</text>

    <!-- Course 3 -->
    <text x="52" y="292" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">💻 Computer Sci</text>
    
    <!-- Course 4 -->
    <text x="52" y="325" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">🧬 Organic Chem</text>

    <line x1="40" y1="350" x2="200" y2="350" />

    <!-- Flashcards & Tools Section -->
    <text x="45" y="375" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">STUDY TOOLS</text>
    <rect x="45" y="390" width="155" height="40" rx="6" />
    <text x="60" y="414" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e1e1e" stroke="none">🎴 Flashcard Deck (24)</text>

    <rect x="45" y="440" width="155" height="40" rx="6" />
    <text x="60" y="464" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e1e1e" stroke="none">⏱️ Pomodoro Timer</text>

    <!-- ==================== MAIN CONTENT: OPEN NOTEBOOK ==================== -->
    <!-- Top Bar inside Main View -->
    <text x="245" y="100" font-family="sans-serif" font-weight="bold" font-size="16" fill="#1e1e1e" stroke="none">Unit 3: Classical Mechanics &amp; Motion</text>
    <text x="750" y="100" font-family="sans-serif" font-size="10" fill="#1e1e1e" stroke="none">Last edited: Today, 2:15 PM</text>
    
    <!-- Action Badges -->
    <rect x="850" y="85" width="50" height="22" rx="4" />
    <text x="860" y="100" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1e1e1e" stroke="none">PDF ⤓</text>
    
    <rect x="910" y="85" width="45" height="22" rx="4" />
    <text x="920" y="100" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1e1e1e" stroke="none">Edit ✏️</text>

    <line x1="220" y1="115" x2="975" y2="115" />

    <!-- Open Lined Notebook Sheet -->
    <rect x="245" y="135" width="450" height="430" rx="8" />
    
    <!-- Spiral Binder Rings on Left of Notebook -->
    <circle cx="245" cy="165" r="4" fill="#1e1e1e" />
    <circle cx="245" cy="205" r="4" fill="#1e1e1e" />
    <circle cx="245" cy="245" r="4" fill="#1e1e1e" />
    <circle cx="245" cy="285" r="4" fill="#1e1e1e" />
    <circle cx="245" cy="325" r="4" fill="#1e1e1e" />
    <circle cx="245" cy="365" r="4" fill="#1e1e1e" />
    <circle cx="245" cy="405" r="4" fill="#1e1e1e" />
    <circle cx="245" cy="445" r="4" fill="#1e1e1e" />
    <circle cx="245" cy="485" r="4" fill="#1e1e1e" />
    <circle cx="245" cy="525" r="4" fill="#1e1e1e" />

    <!-- Red Margin Line -->
    <line x1="285" y1="135" x2="285" y2="565" stroke-dasharray="4,2" />

    <!-- Notebook Content Lines & Handwritten Notes -->
    <text x="300" y="165" font-family="sans-serif" font-weight="bold" font-size="14" fill="#1e1e1e" stroke="none">Newton's Second Law</text>
    <line x1="300" y1="172" x2="675" y2="172" />

    <text x="300" y="195" font-family="sans-serif" font-size="11" fill="#1e1e1e" stroke="none">• Force equals mass times acceleration.</text>
    <line x1="300" y1="202" x2="675" y2="202" />

    <!-- Key Formula Highlight Box (Doodle Style) -->
    <rect x="310" y="215" width="160" height="40" rx="6" />
    <text x="350" y="240" font-family="serif" font-weight="bold" font-size="18" fill="#1e1e1e" stroke="none">F = m · a</text>
    <line x1="300" y1="262" x2="675" y2="262" />

    <text x="300" y="285" font-family="sans-serif" font-size="11" fill="#1e1e1e" stroke="none">• Where F = Force (N), m = Mass (kg), a = Accel (m/s²)</text>
    <line x1="300" y1="292" x2="675" y2="292" />

    <!-- Doodle Diagram: Block on Incline -->
    <path d="M 310 370 L 420 370 L 420 310 Z" />
    <rect x="350" y="325" width="28" height="22" transform="rotate(-28 350 325)" />
    <!-- Force Vectors -->
    <path d="M 360 320 L 380 308" />
    <path d="M 380 308 L 374 308 M 380 308 L 378 314" />
    <text x="385" y="305" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1e1e1e" stroke="none">F_net</text>

    <text x="440" y="330" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">Free Body Diagram</text>
    <text x="440" y="348" font-family="sans-serif" font-size="10" fill="#1e1e1e" stroke="none">Remember to resolve vectors</text>
    <text x="440" y="362" font-family="sans-serif" font-size="10" fill="#1e1e1e" stroke="none">into x and y components!</text>
    
    <line x1="300" y1="382" x2="675" y2="382" />
    <line x1="300" y1="412" x2="675" y2="412" />

    <text x="300" y="435" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">Key Takeaways for Exam:</text>
    <line x1="300" y1="442" x2="675" y2="442" />

    <rect x="300" y="452" width="8" height="8" />
    <text x="315" y="460" font-family="sans-serif" font-size="10" fill="#1e1e1e" stroke="none">Always draw vector components first.</text>
    <line x1="300" y1="472" x2="675" y2="472" />

    <rect x="300" y="482" width="8" height="8" />
    <text x="315" y="490" font-family="sans-serif" font-size="10" fill="#1e1e1e" stroke="none">Friction acts opposite to direction of motion.</text>
    <line x1="300" y1="502" x2="675" y2="502" />

    <!-- ==================== RIGHT PANEL: ATTACHMENTS & QUIZ ==================== -->
    <!-- Attached Reference Card -->
    <rect x="715" y="135" width="240" height="180" rx="8" />
    <text x="730" y="160" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1e1e1e" stroke="none">📎 Attached PDF Diagram</text>
    
    <!-- Mini Preview inside Card -->
    <rect x="730" y="175" width="210" height="95" rx="4" />
    <circle cx="835" cy="220" r="30" />
    <line x1="835" y1="220" x2="860" y2="200" />
    <path d="M 860 200 L 853 200 M 860 200 L 858 207" />
    <text x="800" y="225" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1e1e1e" stroke="none">Circular Motion</text>
    <text x="730" y="295" font-family="sans-serif" font-size="9" fill="#1e1e1e" stroke="none">Click to expand preview...</text>

    <!-- Quick Self-Quiz Widget -->
    <rect x="715" y="330" width="240" height="235" rx="8" />
    <text x="730" y="355" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1e1e1e" stroke="none">❓ Quick Knowledge Check</text>
    <text x="730" y="378" font-family="sans-serif" font-size="10" fill="#1e1e1e" stroke="none">What is the SI unit of Force?</text>

    <!-- Quiz Options -->
    <rect x="730" y="392" width="210" height="26" rx="4" />
    <circle cx="745" cy="405" r="4" />
    <text x="758" y="409" font-family="sans-serif" font-size="10" fill="#1e1e1e" stroke="none">A) Joules (J)</text>

    <rect x="730" y="425" width="210" height="26" rx="4" />
    <circle cx="745" cy="438" r="4" fill="#1e1e1e" />
    <text x="758" y="442" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e1e1e" stroke="none">B) Newtons (N)  ✓</text>

    <rect x="730" y="458" width="210" height="26" rx="4" />
    <circle cx="745" cy="471" r="4" />
    <text x="758" y="475" font-family="sans-serif" font-size="10" fill="#1e1e1e" stroke="none">C) Watts (W)</text>

    <!-- Submit Button -->
    <rect x="730" y="500" width="210" height="30" rx="6" />
    <text x="800" y="520" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1e1e1e" stroke="none">Submit Answer</text>

  </g>
</svg>

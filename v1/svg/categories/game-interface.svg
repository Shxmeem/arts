<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <!-- Doodle Sketch Filter for Hand-Drawn Wobbly Effect -->
    <filter id="sketch-filter" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Notebook Paper Pattern -->
    <pattern id="notebook-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d5e2ee" stroke-width="1.5" />
    </pattern>

    <!-- Hatching Pattern for Shadows -->
    <pattern id="hatch-pattern" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2b2b2b" stroke-width="1.2" opacity="0.15" />
    </pattern>

    <style>
      .doodle-bg { fill: #fbf9f1; }
      .grid-bg { fill: url(#notebook-grid); }
      .margin-line { stroke: #ff9999; stroke-width: 2; stroke-dasharray: 8,4; }
      
      /* Master Ink Style */
      .ink {
        fill: none;
        stroke: #2b2b2b;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#sketch-filter);
      }

      .ink-thin {
        fill: none;
        stroke: #2b2b2b;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#sketch-filter);
      }

      .ink-thick {
        fill: none;
        stroke: #2b2b2b;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#sketch-filter);
      }

      /* Fill Colors with Hand-Drawn Vibe */
      .fill-yellow { fill: #fff066; }
      .fill-blue { fill: #a2d2ff; }
      .fill-pink { fill: #ffc8dd; }
      .fill-green { fill: #b9fbc0; }
      .fill-red { fill: #ff70a6; }
      .fill-purple { fill: #d0f4de; }
      .fill-dark { fill: #2b2b2b; }
      .fill-hatch { fill: url(#hatch-pattern); }

      /* Text Style */
      .doodle-text {
        font-family: "Comic Sans MS", "Marker Felt", "Comic Neue", cursive, sans-serif;
        font-weight: bold;
        fill: #2b2b2b;
        filter: url(#sketch-filter);
      }
    </style>
  </defs>

  <!-- Background Paper -->
  <rect width="1000" height="700" class="doodle-bg" />
  <rect width="1000" height="700" class="grid-bg" />
  <line x1="80" y1="0" x2="80" y2="700" class="margin-line" />

  <!-- Background Decorative Doodles -->
  <g class="ink-thin" opacity="0.4">
    <!-- Stars & Sparkles -->
    <path d="M 120 100 L 125 115 L 140 120 L 125 125 L 120 140 L 115 125 L 100 120 L 115 115 Z" />
    <path d="M 880 80 L 883 92 L 895 95 L 883 98 L 880 110 L 877 98 L 865 95 L 877 92 Z" />
    <path d="M 920 520 L 923 532 L 935 535 L 923 538 L 920 550 L 917 538 L 905 535 L 917 532 Z" />
    <!-- Swirls and Arrows -->
    <path d="M 40 180 Q 20 200 40 220 T 60 250" />
    <path d="M 680 150 Q 720 130 750 160" marker-end="url(#arrow)" />
    <!-- Little Clouds -->
    <path d="M 20 380 Q 30 360 50 370 Q 70 350 85 370 Q 100 370 95 390 Q 70 410 20 380 Z" />
  </g>

  <!-- MAIN GAME SCREEN CONTAINER (Sketchy Frame) -->
  <g id="game-frame">
    <!-- Frame Shadow -->
    <rect x="125" y="45" width="760" height="610" rx="25" class="fill-hatch" />
    <!-- Main Screen Outer -->
    <rect x="115" y="35" width="760" height="610" rx="20" fill="#ffffff" class="ink-thick" />
    <rect x="123" y="43" width="744" height="594" rx="15" class="ink-thin" />
  </g>

  <!-- TOP HUD (Heads-Up Display) -->
  <g id="top-hud">
    <!-- Player Avatar Box -->
    <g id="avatar">
      <rect x="145" y="55" width="65" height="65" rx="12" class="fill-yellow" />
      <rect x="145" y="55" width="65" height="65" rx="12" class="ink" />
      <!-- Doodle Character Face -->
      <circle cx="177" cy="82" r="18" class="ink-thin fill-pink" />
      <!-- Eyes -->
      <circle cx="170" cy="78" r="2.5" class="fill-dark" />
      <circle cx="184" cy="78" r="2.5" class="fill-dark" />
      <!-- Smile -->
      <path d="M 168 87 Q 177 96 186 87" class="ink-thin" />
      <!-- Crown -->
      <path d="M 162 64 L 167 56 L 177 61 L 187 56 L 192 64 Z" class="fill-yellow ink-thin" />
    </g>

    <!-- Player Name & Level -->
    <text x="220" y="78" class="doodle-text" font-size="18">HERO_NOOB</text>
    <rect x="220" y="86" width="60" height="18" rx="5" class="fill-purple ink-thin" />
    <text x="230" y="100" class="doodle-text" font-size="11">LVL 99</text>

    <!-- Health Bar -->
    <g id="hp-bar">
      <rect x="300" y="60" width="180" height="22" rx="8" class="fill-hatch" />
      <rect x="298" y="58" width="180" height="22" rx="8" fill="#fff" class="ink" />
      <rect x="301" y="61" width="135" height="16" rx="5" class="fill-red ink-thin" />
      <!-- Heart Icon -->
      <path d="M 290 69 C 290 60, 275 60, 275 70 C 275 80, 290 88, 290 88 C 290 88, 305 80, 305 70 C 305 60, 290 60, 290 69 Z" class="fill-red ink" />
      <text x="490" y="75" class="doodle-text" font-size="14">HP</text>
    </g>

    <!-- Mana/Energy Bar -->
    <g id="mp-bar">
      <rect x="300" y="90" width="140" height="16" rx="6" class="fill-hatch" />
      <rect x="298" y="88" width="140" height="16" rx="6" fill="#fff" class="ink" />
      <rect x="300" y="90" width="90" height="12" rx="4" class="fill-blue ink-thin" />
      <!-- Energy Lightning Icon -->
      <path d="M 285 86 L 275 98 L 283 98 L 279 108 L 291 94 L 283 94 Z" class="fill-yellow ink-thin" />
    </g>

    <!-- Score / Coin Counter -->
    <g id="coins" transform="translate(680, 55)">
      <rect x="0" y="0" width="160" height="40" rx="12" class="fill-yellow ink" />
      <!-- Coin Icon -->
      <circle cx="20" cy="20" r="12" class="fill-yellow ink" />
      <text x="16" y="25" class="doodle-text" font-size="16">$</text>
      <text x="42" y="26" class="doodle-text" font-size="18">99,420</text>
      <!-- Plus Button -->
      <rect x="128" y="8" width="24" height="24" rx="6" class="fill-green ink-thin" />
      <text x="133" y="26" class="doodle-text" font-size="18">+</text>
    </g>
  </g>

  <!-- GAME WORLD VIEWPORT (Doodle Play Area) -->
  <g id="game-viewport">
    <!-- Viewport Frame -->
    <rect x="145" y="135" width="530" height="380" rx="12" class="fill-hatch" />
    <rect x="140" y="130" width="530" height="380" rx="12" fill="#eef8ff" class="ink" />

    <!-- Sun / Environment -->
    <circle cx="200" cy="180" r="25" class="fill-yellow ink-thin" stroke-dasharray="4,2" />
    <!-- Doodle Cloud -->
    <path d="M 520 180 Q 535 160 560 170 Q 580 150 600 170 Q 620 170 615 190 Q 590 210 520 190 Z" class="fill-pink ink-thin" opacity="0.7" />

    <!-- Hills in Background -->
    <path d="M 140 420 Q 250 320 380 410 Q 500 300 670 430 L 670 510 L 140 510 Z" class="fill-green ink-thin" />
    <path d="M 300 450 Q 450 350 670 420" class="ink-thin" stroke-dasharray="6,4" />

    <!-- Gameplay Elements: Platforms -->
    <rect x="200" y="330" width="110" height="20" rx="5" class="fill-yellow ink" />
    <!-- Hatching under platform -->
    <path d="M 205 350 L 200 360 M 220 350 L 215 360 M 240 350 L 235 360 M 260 350 L 255 360 M 280 350 L 275 360" class="ink-thin" />

    <rect x="420" y="270" width="130" height="20" rx="5" class="fill-yellow ink" />

    <!-- Treasure Chest -->
    <g transform="translate(470, 222)">
      <rect x="0" y="12" width="35" height="35" rx="3" class="fill-yellow ink" />
      <path d="M -2 12 Q 17 0 37 12 Z" class="fill-red ink" />
      <circle cx="17" cy="25" r="4" class="fill-dark" />
      <!-- Sparkles around chest -->
      <path d="M -8 5 L -3 5 M -5 2 L -5 8" class="ink-thin" />
      <path d="M 40 0 L 45 3 M 42 -3 L 43 5" class="ink-thin" />
    </g>

    <!-- PLAYER CHARACTER (In Game) -->
    <g id="player-character" transform="translate(230, 245)">
      <!-- Stick Figure Hero with Cape & Sword -->
      <!-- Cape -->
      <path d="M 10 25 Q -15 35 0 55 Q 15 45 15 30 Z" class="fill-red ink-thin" />
      <!-- Body -->
      <circle cx="20" cy="15" r="12" class="fill-yellow ink" /> <!-- Head -->
      <!-- Face -->
      <circle cx="17" cy="13" r="1.5" class="fill-dark" />
      <circle cx="24" cy="13" r="1.5" class="fill-dark" />
      <path d="M 18 20 Q 21 23 24 20" class="ink-thin" /> <!-- Smile -->
      <line x1="20" y1="27" x2="20" y2="55" class="ink" /> <!-- Torso -->
      <!-- Legs -->
      <polyline points="20,55 8,75 2,85" class="ink" />
      <polyline points="20,55 30,72 38,85" class="ink" />
      <!-- Arms & Sword -->
      <polyline points="20,35 5,45 -5,40" class="ink" />
      <polyline points="20,35 38,30 50 25" class="ink" />
      <!-- Sword -->
      <path d="M 48 18 L 54 32 L 80 10 L 68 2 Z" class="fill-blue ink-thin" />
      <line x1="45" y1="23" x2="52" y2="34" class="ink" /> <!-- Guard -->
    </g>

    <!-- BOSS MONSTER -->
    <g id="boss-monster" transform="translate(540, 335)">
      <!-- Cute Doodle Blob Monster -->
      <path d="M 10 60 Q -10 30 15 10 Q 50 -10 80 10 Q 110 30 90 60 Q 70 85 40 80 Q 10 85 10 60 Z" class="fill-pink ink-thick" />
      <!-- Eyes (3 Eyes!) -->
      <circle cx="30" cy="30" r="8" fill="#fff" class="ink" />
      <circle cx="32" cy="30" r="3" class="fill-dark" />

      <circle cx="50" cy="22" r="10" fill="#fff" class="ink" />
      <circle cx="52" cy="22" r="4" class="fill-dark" />

      <circle cx="70" cy="32" r="7" fill="#fff" class="ink" />
      <circle cx="71" cy="32" r="2.5" class="fill-dark" />

      <!-- Sharp Teeth Mouth -->
      <path d="M 25 50 Q 50 70 75 50 Z" fill="#2b2b2b" class="ink-thin" />
      <polyline points="30,51 35,58 40,52 45,59 50,52 55,59 60,52 65,58 70,51" stroke="#fff" fill="#fff" stroke-width="2" />

      <!-- Little Wings -->
      <path d="M -5 20 Q -25 0 0 10 Z" class="fill-purple ink" />
      <path d="M 95 20 Q 115 0 90 10 Z" class="fill-purple ink" />

      <!-- Monster HP Bar -->
      <rect x="5" y="-20" width="80" height="10" rx="4" fill="#fff" class="ink-thin" />
      <rect x="7" y="-18" width="30" height="6" rx="2" class="fill-red" />
      <text x="27" y="-25" class="doodle-text" font-size="10">BOSS</text>
    </g>

    <!-- Action Effects / Onomatopoeia -->
    <g transform="translate(360, 210) rotate(-12)">
      <polygon points="20,0 32,12 50,2 42,20 60,30 40,35 42,55 28,42 15,58 12,38 -5,35 8,22 -2,8 15,12" class="fill-yellow ink-thin" />
      <text x="8" y="32" class="doodle-text" font-size="16" fill="#ff0000">POW!</text>
    </g>
  </g>

  <!-- RIGHT SIDEBAR (Inventory & Quests) -->
  <g id="sidebar" transform="translate(690, 130)">
    <!-- Sidebar Box -->
    <rect x="0" y="0" width="170" height="380" rx="12" class="fill-hatch" />
    <rect x="-5" y="-5" width="170" height="380" rx="12" fill="#fff" class="ink" />

    <text x="35" y="25" class="doodle-text" font-size="16">BAG OF STUFF</text>
    <line x1="10" y1="35" x2="145" y2="35" class="ink-thin" stroke-dasharray="4,3" />

    <!-- Inventory Grid -->
    <!-- Row 1 -->
    <rect x="12" y="50" width="40" height="40" rx="8" class="fill-purple ink-thin" />
    <!-- Potion -->
    <path d="M 27 60 L 37 60 L 37 64 L 40 70 C 42 78, 32 84, 27 82 C 22 84, 12 78, 14 70 L 17 64 L 17 60 Z" class="fill-red ink-thin" />

    <rect x="60" y="50" width="40" height="40" rx="8" class="fill-purple ink-thin" />
    <!-- Scroll -->
    <ellipse cx="80" cy="70" rx="10" ry="14" class="fill-yellow ink-thin" transform="rotate(30 80 70)" />

    <rect x="108" y="50" width="40" height="40" rx="8" class="fill-purple ink-thin" />
    <!-- Gem -->
    <polygon points="128,56 138,64 128,82 118,64" class="fill-blue ink-thin" />

    <!-- Row 2 -->
    <rect x="12" y="100" width="40" height="40" rx="8" class="fill-purple ink-thin" />
    <!-- Key -->
    <circle cx="27" cy="115" r="6" class="ink-thin" />
    <path d="M 31 118 L 42 129 M 38 125 L 42 121" class="ink-thin" />

    <rect x="60" y="100" width="40" height="40" rx="8" class="fill-purple ink-thin" />
    <text x="73" y="127" class="doodle-text" font-size="20" opacity="0.3">?</text>

    <rect x="108" y="100" width="40" height="40" rx="8" class="fill-purple ink-thin" />
    <text x="121" y="127" class="doodle-text" font-size="20" opacity="0.3">?</text>

    <!-- Quests Section -->
    <text x="35" y="175" class="doodle-text" font-size="16">QUEST LOG</text>
    <line x1="10" y1="183" x2="145" y2="183" class="ink-thin" stroke-dasharray="4,3" />

    <!-- Quest Item 1 -->
    <g transform="translate(10, 195)">
      <rect x="0" y="0" width="18" height="18" rx="4" class="fill-green ink-thin" />
      <path d="M 4 9 L 8 14 L 15 4" class="ink-thick" stroke-linecap="round" />
      <text x="25" y="14" class="doodle-text" font-size="11" fill="#777"><tspan stroke="none">Slay 5 Slimes</tspan></text>
      <line x1="25" y1="10" x2="110" y2="10" stroke="#777" stroke-width="2" />
    </g>

    <!-- Quest Item 2 -->
    <g transform="translate(10, 230)">
      <rect x="0" y="0" width="18" height="18" rx="4" class="ink-thin" />
      <text x="25" y="14" class="doodle-text" font-size="11">Find Magic Beans</text>
      <!-- Progress mini bar -->
      <rect x="25" y="20" width="100" height="6" rx="3" class="ink-thin" />
      <rect x="26" y="21" width="60" height="4" rx="2" class="fill-yellow" />
    </g>

    <!-- Quest Item 3 -->
    <g transform="translate(10, 275)">
      <rect x="0" y="0" width="18" height="18" rx="4" class="ink-thin" />
      <text x="25" y="14" class="doodle-text" font-size="11">Beat Big Dragon</text>
    </g>

    <!-- Mini Map -->
    <g transform="translate(15, 305)">
      <rect x="0" y="0" width="130" height="55" rx="8" class="fill-green ink-thin" opacity="0.5" />
      <rect x="0" y="0" width="130" height="55" rx="8" class="ink-thin" />
      <!-- Map dots and lines -->
      <path d="M 10 40 Q 40 10 70 30 T 120 10" class="ink-thin" stroke-dasharray="3,3" />
      <circle cx="10" cy="40" r="4" class="fill-red ink-thin" />
      <circle cx="70" cy="30" r="3" class="fill-dark" />
      <circle cx="120" cy="10" r="5" class="fill-yellow ink-thin" />
      <!-- You are here X -->
      <text x="5" y="35" class="doodle-text" font-size="10" fill="red">X</text>
    </g>
  </g>

  <!-- BOTTOM CONTROLS / HUD ACTION BAR -->
  <g id="bottom-bar" transform="translate(140, 530)">
    <!-- Action Bar Container -->
    <rect x="5" y="5" width="530" height="85" rx="18" class="fill-hatch" />
    <rect x="0" y="0" width="530" height="85" rx="18" fill="#fff" class="ink" />

    <!-- Skill Buttons (Hotbar) -->
    <!-- Skill 1: Sword Attack -->
    <g transform="translate(20, 15)">
      <rect x="0" y="0" width="55" height="55" rx="10" class="fill-yellow ink" />
      <path d="M 15 40 L 40 15 M 35 15 L 40 15 L 40 20" class="ink-thick" />
      <text x="5" y="12" class="doodle-text" font-size="10">1</text>
    </g>

    <!-- Skill 2: Fireball -->
    <g transform="translate(85, 15)">
      <rect x="0" y="0" width="55" height="55" rx="10" class="fill-red ink" />
      <!-- Fire Doodle -->
      <path d="M 27 45 C 15 45 15 30 25 20 C 25 28 32 25 30 12 C 42 20 45 35 37 45 Z" fill="#fff066" class="ink-thin" />
      <text x="5" y="12" class="doodle-text" font-size="10">2</text>
    </g>

    <!-- Skill 3: Shield/Defend -->
    <g transform="translate(150, 15)">
      <rect x="0" y="0" width="55" height="55" rx="10" class="fill-blue ink" />
      <!-- Shield Doodle -->
      <path d="M 17 18 L 38 18 L 38 32 C 38 40 27 45 27 45 C 27 45 17 40 17 32 Z" fill="#fff" class="ink-thin" />
      <text x="5" y="12" class="doodle-text" font-size="10">3</text>
    </g>

    <!-- Skill 4: Heal (On Cooldown) -->
    <g transform="translate(215, 15)">
      <rect x="0" y="0" width="55" height="55" rx="10" class="fill-green ink" />
      <!-- Cross -->
      <path d="M 22 15 H 33 V 40 H 22 Z M 15 22 H 40 V 33 H 15 Z" fill="#fff" class="ink-thin" />
      <!-- Cooldown Overlay -->
      <path d="M 0 0 L 55 55 L 0 55 Z" fill="#2b2b2b" opacity="0.3" rx="10" />
      <text x="22" y="35" class="doodle-text" font-size="16" fill="#fff">2s</text>
      <text x="5" y="12" class="doodle-text" font-size="10">4</text>
    </g>

    <!-- Divider Line -->
    <line x1="285" y1="10" x2="285" y2="75" class="ink-thin" stroke-dasharray="4,4" />

    <!-- Virtual D-PAD / Touch Controls -->
    <g transform="translate(305, 7)">
      <!-- Left Arrow -->
      <rect x="0" y="24" width="24" height="24" rx="5" class="fill-purple ink-thin" />
      <path d="M 16 36 L 8 36 L 12 30 M 8 36 L 12 42" class="ink-thin" />

      <!-- Right Arrow -->
      <rect x="52" y="24" width="24" height="24" rx="5" class="fill-purple ink-thin" />
      <path d="M 60 36 L 68 36 L 64 30 M 68 36 L 64 42" class="ink-thin" />

      <!-- Up Arrow -->
      <rect x="26" y="0" width="24" height="24" rx="5" class="fill-purple ink-thin" />
      <path d="M 38 16 L 38 8 L 32 12 M 38 8 L 44 12" class="ink-thin" />

      <!-- Down Arrow -->
      <rect x="26" y="48" width="24" height="24" rx="5" class="fill-purple ink-thin" />
      <path d="M 38 56 L 38 64 L 32 60 M 38 64 L 44 60" class="ink-thin" />
    </g>

    <!-- Big JUMP Button -->
    <g transform="translate(415, 12)">
      <ellipse cx="45" cy="30" rx="40" ry="25" class="fill-hatch" />
      <ellipse cx="42" cy="27" rx="40" ry="25" class="fill-yellow ink-thick" />
      <text x="20" y="34" class="doodle-text" font-size="18">JUMP!</text>
    </g>
  </g>

  <!-- PAUSE / SETTINGS BUTTON (Top Right Floating) -->
  <g id="pause-btn" transform="translate(820, 50)">
    <rect x="0" y="0" width="40" height="40" rx="10" class="fill-hatch" />
    <rect x="-3" y="-3" width="40" height="40" rx="10" fill="#fff" class="ink" />
    <!-- Pause Bars -->
    <rect x="8" y="7" width="6" height="18" rx="2" class="fill-dark" />
    <rect x="19" y="7" width="6" height="18" rx="2" class="fill-dark" />
  </g>

  <!-- CHAT / DIALOG POPUP (Doodle Style Overlay) -->
  <g id="dialog-box" transform="translate(170, 420)">
    <!-- Speech Bubble Tail -->
    <polygon points="30,0 45,-20 60,0" fill="#fff" class="ink" />
    <!-- Main Box -->
    <rect x="0" y="0" width="320" height="65" rx="15" class="fill-hatch" />
    <rect x="-4" y="-4" width="320" height="65" rx="15" fill="#fff" class="ink-thick" />
    <!-- NPC / System Text -->
    <text x="15" y="22" class="doodle-text" font-size="13" fill="#ff0055">GUIDE-BOT:</text>
    <text x="15" y="42" class="doodle-text" font-size="12">Watch out for the Pink Blob! </text>
    <text x="15" y="55" class="doodle-text" font-size="11" opacity="0.7">Press [2] to use Fireball!</text>
    <!-- Little hand-drawn arrow to continue -->
    <path d="M 290 40 L 300 48 L 290 54" class="ink-thick" />
  </g>

  <!-- EXTRA DOODLE DETAILS (Annotations & Scribbles) -->
  <!-- Arrow pointing to Jump -->
  <g class="ink-thin" opacity="0.6" transform="translate(580, 600)">
    <path d="M -30 40 Q -10 50 20 25" />
    <path d="M 20 25 L 10 23 M 20 25 L 18 33" />
    <text x="-100" y="45" class="doodle-text" font-size="12" transform="rotate(-5)">Tap to Smash!</text>
  </g>

  <!-- Random Coffee Stain Doodle on Paper -->
  <circle cx="910" cy="610" r="35" class="ink-thin" opacity="0.15" stroke-dasharray="12,5,2,4" />
  <circle cx="910" cy="610" r="32" class="ink-thin" opacity="0.1" />

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Sketchy Line Filter for Hand-Drawn Doodle Feel -->
    <filter id="sketch-rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <style>
      .ink-line {
        stroke: #2C2825;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .ink-thin {
        stroke: #2C2825;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .ink-thick {
        stroke: #2C2825;
        stroke-width: 5.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .fill-accent {
        fill: #E07A5F;
      }
      .fill-yellow {
        fill: #F4A261;
      }
      .fill-soft {
        fill: #EAE3D2;
      }
    </style>
  </defs>

  <!-- Filtered Main Group for Hand-Drawn / Doodle Vibe -->
  <g filter="url(#sketch-rough)">

    <!-- SPARKLES & MUSIC NOTES (Doodle Accents) -->
    <!-- Music Note 1 -->
    <path class="ink-thin" d="M 120,100 L 120,130" />
    <circle cx="115" cy="130" r="6" fill="#2C2825" />
    <path class="ink-thin" d="M 120,100 C 130,95 135,105 135,105" />

    <!-- Music Note 2 -->
    <path class="ink-thin" d="M 460,90 L 460,120" />
    <circle cx="455" cy="120" r="6" fill="#2C2825" />
    <path class="ink-thin" d="M 460,90 C 470,85 475,95 475,95" />

    <!-- Music Note 3 (Double) -->
    <path class="ink-thin" d="M 130,370 L 130,400" />
    <path class="ink-thin" d="M 145,365 L 145,395" />
    <circle cx="125" cy="400" r="6" fill="#2C2825" />
    <circle cx="140" cy="395" r="6" fill="#2C2825" />
    <path class="ink-thin" d="M 130,370 C 140,365 145,370 145,365" />

    <!-- Sparkle Stars -->
    <path class="ink-thin" d="M 470,360 Q 470,372 458,372 Q 470,372 470,384 Q 470,372 482,372 Q 470,372 470,360 Z" fill="#2C2825" opacity="0.8" />
    <path class="ink-thin" d="M 90,280 Q 90,292 78,292 Q 90,292 90,304 Q 90,292 102,292 Q 90,292 90,280 Z" fill="#2C2825" opacity="0.8" />

    <!-- Little Hearts & Dots -->
    <path d="M 480,150 C 480,142 470,138 464,145 C 458,138 448,142 448,150 C 448,160 464,168 464,168 C 464,168 480,160 480,150 Z" fill="#E07A5F" stroke="#2C2825" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="100" cy="180" r="4" fill="#2C2825" />
    <circle cx="500" cy="220" r="3" fill="#2C2825" />

    <!-- TURNTABLE BASE -->
    <!-- Main Base -->
    <rect x="145" y="180" width="310" height="220" rx="15" class="ink-thick" fill="#FCF9F2" />
    
    <!-- Wood grain accent line on base -->
    <path class="ink-thin" d="M 155,200 C 250,195 350,205 445,200" />
    <path class="ink-thin" stroke-dasharray="6,5" d="M 155,208 C 250,203 350,213 445,208" />

    <!-- Corner accents -->
    <circle cx="170" cy="205" r="4" fill="#E07A5F" stroke="#2C2825" stroke-width="2" />
    <circle cx="430" cy="205" r="4" fill="#E07A5F" stroke="#2C2825" stroke-width="2" />

    <!-- PLATTER / TURNTABLE DISC -->
    <circle cx="300" cy="280" r="90" class="ink-thick" fill="#EAE3D2" />
    <circle cx="300" cy="280" r="82" class="ink-line" fill="#2C2825" />
    
    <!-- Vinyl grooves -->
    <circle cx="300" cy="280" r="72" class="ink-thin" />
    <circle cx="300" cy="280" r="62" class="ink-thin" />
    <circle cx="300" cy="280" r="52" class="ink-thin" />
    <circle cx="300" cy="280" r="42" class="ink-thin" />
    <circle cx="300" cy="280" r="32" class="ink-thin" />

    <!-- Vinyl label (center) -->
    <circle cx="300" cy="280" r="24" class="ink-line" fill="#E07A5F" />
    <circle cx="300" cy="280" r="18" class="ink-thin" fill="#FCF9F2" />
    
    <!-- Center spindle hole -->
    <circle cx="300" cy="280" r="4" class="ink-thick" fill="#2C2825" />

    <!-- TONE ARM BASE -->
    <!-- Tone arm pivot point (bottom right) -->
    <circle cx="420" cy="350" r="16" class="ink-thick" fill="#EAE3D2" />
    <circle cx="420" cy="350" r="8" class="ink-line" fill="#2C2825" />
    <circle cx="420" cy="350" r="3" fill="#FCF9F2" />

    <!-- Tone arm rest -->
    <path class="ink-thick" d="M 380,360 L 400,355" />
    <path class="ink-thin" d="M 375,362 L 380,360" />

    <!-- Tone arm (the arm itself) -->
    <path class="ink-thick" d="M 420,350 C 400,340 380,320 360,290 L 340,260" />
    
    <!-- Tone arm headshell -->
    <path class="ink-line" d="M 345,265 L 330,250" />
    <path class="ink-thin" d="M 330,250 L 325,248" />

    <!-- Cartridge / Stylus -->
    <path class="ink-thin" d="M 325,248 L 318,245" />
    <circle cx="316" cy="244" r="3" fill="#2C2825" />

    <!-- SPEED SELECTOR KNOB (Left side) -->
    <circle cx="190" cy="360" r="12" class="ink-line" fill="#EAE3D2" />
    <circle cx="190" cy="360" r="6" class="ink-thin" fill="#2C2825" />
    <line x1="190" y1="360" x2="190" y2="354" class="ink-thin" />

    <!-- Speed labels -->
    <path class="ink-thin" d="M 175,380 L 185,380" />
    <path class="ink-thin" d="M 195,380 L 205,380" />

    <!-- POWER BUTTON -->
    <rect x="400" y="380" width="30" height="12" rx="4" class="ink-line" fill="#EAE3D2" />
    <circle cx="415" cy="386" r="3" fill="#2C2825" />

    <!-- ON light indicator -->
    <circle cx="440" cy="386" r="4" class="ink-line" fill="#F4A261" />

    <!-- Small floating Polaroid photo (doodle pop-out) -->
    <g transform="translate(130, 310) rotate(-8)">
      <rect x="0" y="0" width="50" height="60" rx="4" class="ink-line" fill="#FCF9F2" />
      <rect x="5" y="5" width="40" height="38" class="ink-thin" fill="#EAE3D2" />
      <!-- Tiny abstract drawing inside Polaroid -->
      <path class="ink-thin" d="M 10,30 L 20,15 L 28,25 L 35,18 L 42,30" />
      <circle cx="35" cy="12" r="2.5" fill="#F4A261" />
    </g>

    <!-- Doodle accent squiggles around the record -->
    <path class="ink-thin" d="M 200,200 C 210,190 220,200 230,190" />
    <path class="ink-thin" d="M 370,200 C 380,190 390,200 400,190" />

    <!-- Sound wave doodles coming from record -->
    <path class="ink-thin" d="M 230,240 C 220,245 220,255 230,260" />
    <path class="ink-thin" d="M 225,235 C 210,242 210,258 225,265" />
    <path class="ink-thin" d="M 220,230 C 200,240 200,260 220,270" />

  </g>
</svg>

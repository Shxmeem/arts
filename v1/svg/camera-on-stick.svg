<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <!-- Sketchy Line Filter for Hand-Drawn Doodle Vibe -->
    <filter id="sketch-rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <style>
      .ink-line {
        stroke: #2C2825;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .ink-thin {
        stroke: #2C2825;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .ink-thick {
        stroke: #2C2825;
        stroke-width: 5.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
    </style>
  </defs>

  <g filter="url(#sketch-rough)">

    <!-- DOODLE SPARKLES & ACCENTS -->
    <!-- Flash Rays top right -->
    <path class="ink-thin" d="M 400,60 L 415,40" />
    <path class="ink-thin" d="M 420,75 L 445,65" />
    <path class="ink-thin" d="M 425,95 L 450,100" />

    <!-- Sparkle Stars & Heart -->
    <path class="ink-thin" d="M 120,70 Q 120,85 105,85 Q 120,85 120,100 Q 120,85 135,85 Q 120,85 120,70 Z" fill="#2C2825" opacity="0.8" />
    <path class="ink-thin" d="M 470,250 Q 470,262 458,262 Q 470,262 470,274 Q 470,262 482,262 Q 470,262 470,250 Z" fill="#2C2825" opacity="0.8" />
    <path d="M 130,260 C 130,252 120,248 114,255 C 108,248 98,252 98,260 C 98,270 114,278 114,278 C 114,278 130,270 130,260 Z" fill="#E07A5F" stroke="#2C2825" stroke-width="2.5" stroke-linejoin="round" />

    <circle cx="485" cy="180" r="4" fill="#2C2825" />
    <circle cx="105" cy="150" r="3" fill="#2C2825" />

    <!-- MONOPOD / STICK ASSEMBLY -->
    <!-- Base / Foot at Bottom -->
    <ellipse cx="300" cy="580" rx="14" ry="6" fill="#2C2825" />
    
    <!-- Bottom Section -->
    <path class="ink-line" d="M 296,480 L 297,580" />
    <path class="ink-line" d="M 304,480 L 303,580" />
    <!-- Lock Ring 1 -->
    <rect x="292" y="472" width="16" height="10" rx="2" class="ink-line" fill="#2C2825" />

    <!-- Middle Section -->
    <path class="ink-line" d="M 294,360 L 295,472" />
    <path class="ink-line" d="M 306,360 L 305,472" />
    <!-- Lock Ring 2 -->
    <rect x="290" y="350" width="20" height="12" rx="2" class="ink-line" fill="#EAE3D2" />
    <line x1="290" y1="356" x2="310" y2="356" class="ink-thin" />

    <!-- Top Section (Rubber Grip) -->
    <path class="ink-thick" d="M 292,230 L 293,350" />
    <path class="ink-thick" d="M 308,230 L 307,350" />
    <!-- Grip Ribs -->
    <line x1="293" y1="260" x2="307" y2="260" class="ink-thin" />
    <line x1="293" y1="280" x2="307" y2="280" class="ink-thin" />
    <line x1="293" y1="300" x2="307" y2="300" class="ink-thin" />
    <line x1="293" y1="320" x2="307" y2="320" class="ink-thin" />

    <!-- TRIPOD HEAD / MOUNT -->
    <!-- Swivel Mount Base -->
    <rect x="282" y="218" width="36" height="14" rx="3" class="ink-line" fill="#EAE3D2" />
    <!-- Tightening Screw Knob -->
    <path class="ink-line" d="M 318,220 L 328,220 C 331,220 333,222 333,224 L 333,226 C 333,228 331,230 328,230 L 318,230" fill="#2C2825" />
    <!-- Quick Release Plate Screw Mount -->
    <rect x="292" y="205" width="16" height="14" rx="2" class="ink-thick" fill="#2C2825" />

    <!-- CAMERA BODY (Shifted Upwards so Mount Connects Below) -->
    <!-- Strap Lugs -->
    <path class="ink-line" d="M 135,135 C 120,135 115,155 135,160" />
    <path class="ink-line" d="M 465,135 C 480,135 485,155 465,160" />
    <ellipse cx="120" cy="147" rx="4" ry="7" class="ink-thin" />
    <ellipse cx="480" cy="147" rx="4" ry="7" class="ink-thin" />

    <!-- Top Buttons & Dials -->
    <rect x="180" y="60" width="30" height="15" rx="3" class="ink-line" fill="#EAE3D2" />
    <line x1="190" y1="60" x2="190" y2="67" class="ink-thin" />
    <line x1="200" y1="60" x2="200" y2="67" class="ink-thin" />

    <path class="ink-line" d="M 370,75 L 370,57 C 370,53 395,53 395,57 L 395,75" fill="#EAE3D2" />
    <line x1="375" y1="63" x2="390" y2="63" class="ink-thin" />

    <!-- Flash Housing Bump -->
    <path class="ink-thick" d="M 255,75 L 265,50 C 267,45 273,43 280,43 L 320,43 C 327,43 333,45 335,50 L 345,75" fill="#FCF9F2" />
    <path class="ink-thin" d="M 285,43 L 285,37 L 315,37 L 315,43" />

    <!-- Main Camera Body -->
    <rect x="135" y="75" width="330" height="132" rx="20" class="ink-thick" fill="#FCF9F2" />
    
    <!-- Top Accent Line -->
    <path class="ink-line" d="M 136,115 C 230,117 370,113 464,115" />
    <path class="ink-thin" stroke-dasharray="6,5" d="M 140,121 C 240,123 360,119 460,121" />

    <!-- Red Dot Accent -->
    <circle cx="175" cy="97" r="6" fill="#E07A5F" stroke="#2C2825" stroke-width="2.5" />

    <!-- Viewfinder Window -->
    <rect x="390" y="89" width="34" height="20" rx="4" class="ink-line" fill="#2C2825" />
    <rect x="394" y="92" width="26" height="13" rx="3" fill="#FCF9F2" class="ink-thin" />
    <line x1="412" y1="93" x2="402" y2="104" class="ink-thin" />

    <circle cx="365" cy="97" r="4.5" class="ink-line" fill="#F4A261" />

    <!-- Lens Assembly -->
    <circle cx="300" cy="145" r="54" class="ink-thick" fill="#EAE3D2" />
    <circle cx="300" cy="145" r="46" class="ink-line" fill="#FCF9F2" />
    <circle cx="300" cy="145" r="35" class="ink-line" fill="#2C2825" />
    <circle cx="300" cy="145" r="27" class="ink-thin" fill="#3D3835" />

    <!-- Glass Reflection Highlights -->
    <path d="M 282,127 A 23 23 0 0 1 318,127 A 19 19 0 0 0 282,127 Z" fill="#FCF9F2" opacity="0.85" />
    <circle cx="312" cy="155" r="3" fill="#FCF9F2" opacity="0.7" />

  </g>
</svg>

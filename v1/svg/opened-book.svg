<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Sketchy Line Filter for Doodle Feel -->
    <filter id="sketch-rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <style>
      .ink-line { stroke: #2C2825; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ink-thin { stroke: #2C2825; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ink-thick { stroke: #2C2825; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      
      .fill-cover { fill: #E07A5F; }
      .fill-page { fill: #FCF9F2; }
      .fill-accent { fill: #F4A261; }
      
      /* CSS Keyframes Animation */
      @keyframes flippingPage {
        0% {
          transform: rotateY(0deg);
        }
        50% {
          transform: rotateY(-90deg);
        }
        100% {
          transform: rotateY(-180deg);
        }
      }

      @keyframes floatingSparkles {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.8; }
        50% { transform: translateY(-12px) scale(1.15); opacity: 1; }
      }

      .animated-page {
        transform-origin: 300px 320px;
        animation: flippingPage 2.5s ease-in-out infinite alternate;
      }

      .animated-sparkle {
        animation: floatingSparkles 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <g filter="url(#sketch-rough)">

    <!-- SPARKLES & MAGIC ELEMENTS FLOATING ABOVE BOOK -->
    <g class="animated-sparkle">
      <path class="ink-thin" d="M 300,80 Q 300,95 285,95 Q 300,95 300,110 Q 300,95 315,95 Q 300,95 300,80 Z" fill="#2C2825" />
      <path class="ink-thin" d="M 220,130 Q 220,140 210,140 Q 220,140 220,150 Q 220,140 230,140 Q 220,140 220,130 Z" fill="#2C2825" />
      <path class="ink-thin" d="M 380,120 Q 380,132 368,132 Q 380,132 380,144 Q 380,132 392,132 Q 380,132 380,120 Z" fill="#2C2825" />
      
      <path d="M 160,200 C 160,192 150,188 144,195 C 138,188 128,192 128,200 C 128,210 144,218 144,218 C 144,218 160,210 160,200 Z" fill="#E07A5F" stroke="#2C2825" stroke-width="2.5" />
      <circle cx="440" cy="180" r="4" fill="#2C2825" />
      <circle cx="180" cy="120" r="3" fill="#2C2825" />
      <circle cx="410" cy="100" r="3" fill="#2C2825" />
    </g>

    <!-- BOOK COVER BASE -->
    <ellipse cx="300" cy="385" rx="210" ry="25" fill="#2C2825" opacity="0.12" />

    <!-- Hard Cover Left -->
    <path class="ink-thick" fill="#E07A5F" d="M 300,350 C 240,360 120,345 80,325 L 90,205 C 130,225 240,240 300,230 Z" />
    
    <!-- Hard Cover Right -->
    <path class="ink-thick" fill="#E07A5F" d="M 300,350 C 360,360 480,345 520,325 L 510,205 C 470,225 360,240 300,230 Z" />

    <!-- SPINE BASE -->
    <path class="ink-thick" fill="#2C2825" d="M 290,230 C 295,235 305,235 310,230 L 310,350 C 305,355 295,355 290,350 Z" />

    <!-- LEFT PAGES STACK -->
    <path class="ink-thick" fill="#FCF9F2" d="M 300,340 C 240,350 130,335 95,315 L 105,195 C 140,215 240,230 300,220 Z" />
    <path class="ink-thin" d="M 80,325 C 85,320 90,318 95,315" />
    <path class="ink-thin" d="M 82,320 C 87,315 92,313 97,310" />
    <path class="ink-thin" d="M 140,235 C 180,242 240,245 280,238" stroke-dasharray="6,4" />
    <path class="ink-thin" d="M 135,255 C 175,262 240,265 280,258" />
    <path class="ink-thin" d="M 130,275 C 170,282 240,285 280,278" />
    <path class="ink-thin" d="M 125,295 C 165,302 235,305 275,298" />

    <!-- RIGHT PAGES STACK -->
    <path class="ink-thick" fill="#FCF9F2" d="M 300,340 C 360,350 470,335 505,315 L 495,195 C 460,215 360,230 300,220 Z" />
    <path class="ink-thin" d="M 520,325 C 515,320 510,318 505,315" />
    <path class="ink-thin" d="M 518,320 C 513,315 508,313 503,310" />
    <path class="ink-thin" d="M 320,238 C 360,245 420,242 460,235" />
    <path class="ink-thin" d="M 320,258 C 360,265 425,262 465,255" />
    <path class="ink-thin" d="M 320,278 C 360,285 430,282 470,275" />
    <path class="ink-thin" d="M 325,298 C 365,305 435,302 475,295" stroke-dasharray="8,5" />

    <!-- ANIMATED TURNING PAGE -->
    <g class="animated-page">
      <path class="ink-thick" fill="#FCF9F2" d="M 300,340 C 360,350 470,335 505,315 L 495,195 C 460,215 360,230 300,220 Z" />
      <path class="ink-thin" d="M 320,238 C 360,245 420,242 460,235" stroke-dasharray="5,4" />
      <path class="ink-thin" d="M 320,258 C 360,265 425,262 465,255" />
      <path class="ink-thin" d="M 320,278 C 360,285 430,282 470,275" />
    </g>

    <!-- CENTER SEAM -->
    <path class="ink-line" d="M 300,220 L 300,340" />

  </g>
</svg>
